    (S.data.anonymized ? `<span class="pill">Anonymized export</span>` : "");
}

function renderSummary() {
  const sim = S.sim, c = sim.conflicts;
  const n = sev => c.filter(x => x.sev === sev).length;
  const runs = sim.all.filter(r => r.start >= sim.V0 && r.start < sim.END).length;
  const activeJobs = S.data.jobs.filter(j => j.enabled !== false).length;
  const b = sim.busiest, l = sim.latest;
  $("#summary").innerHTML = `
    <div class="tile tap" id="tileHost" role="button" tabindex="0" title="Show servers, click again to go back"><div class="k">Busiest server</div>${sim.busiestHost ? `<div class="v">${sim.busiestHost.peak.toFixed(1)} <small>${sim.busiestHost.h.cores ? `of ${sim.busiestHost.h.cores} cores at peak` : "cores at peak"}</small></div><div class="s">${esc(nm(sim.busiestHost.h))} · ${runs.toLocaleString()} runs from ${activeJobs} jobs in view</div>` : `<div class="v">${runs.toLocaleString()} <small>runs</small></div><div class="s">${activeJobs} active jobs in view</div>`}</div>
    <div class="tile"><div class="k">Conflicts</div><div class="v">${n("crit") + n("warn")} <small>to fix</small></div>
      <div class="sev-row"><span class="sev crit">${n("crit")} critical</span><span class="sev warn">${n("warn")} warning</span><span class="sev info">${n("info")} info</span></div></div>
    <div class="tile"><div class="k">Busiest repository</div>${b ? `<div class="v">${b.peak} <small>of ${b.cap} slots at peak</small></div><div class="s">${esc(nm(b.repo))}</div>` : `<div class="v">None</div>`}</div>
    <div class="tile"><div class="k">Latest finish</div>${l ? `<div class="v mono">${hhmm(l.end)}</div><div class="s">${esc(nm(jobById(l.run.jobId)))} on ${fmtDay(Math.floor(l.end / 1440))}</div>` : `<div class="v">None</div>`}</div>`;
}

function bindTiles() {
  const t = $("#tileHost"); if (!t || !S.sim.busiestHost) return;
  const go = () => {
    if (S.settings.view === "infra" && S.selConf && S.selConf.startsWith("host:")) return resetView();
    setView("infra");
    const c = S.sim.conflicts.find(x => x.hostId === S.sim.busiestHost.h.id);
    if (c) { setTab("conf"); focusConflict(c.id); }
    else { S.selHost = S.sim.busiestHost.h.id; S.tab = "host"; renderPane(); }
  };
  t.addEventListener("click", go);
  t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
}

function renderCounts() {
  const c = S.sim.conflicts.filter(x => x.sev !== "info").length;
  const el = $("#cntConf"); el.textContent = c; el.classList.toggle("hot", S.sim.conflicts.some(x => x.sev === "crit"));
  $("#cntChg").textContent = changes().length;
}

function renderTimeline() {
  LABW = window.innerWidth < 600 ? 150 : 230;
  const st = S.settings, px = st.pxh / 60, H = st.horizon, W = H * 1440 * px, V0 = S.sim.V0, V1 = S.sim.END;
  const X = t => (t - V0) * px, D0 = Math.floor(V0 / 1440), D1 = Math.ceil(V1 / 1440);
  const clip = (a, b) => [Math.max(V0, a), Math.min(V1, b)];
  const rows = rowsModel();
  const keepX = tl.scrollLeft, keepY = tl.scrollTop;
  const selConf = S.selConf ? S.sim.conflicts.find(c => c.id === S.selConf) : null;
  const hlJobs = new Set(selConf ? selConf.jobIds : S.sel ? [S.sel] : []);
  const parts = [];
  parts.push(`<div class="tl-inner" style="--labw:${LABW}px;width:${LABW + W}px">`);
  // axis
  let ax = `<div class="row axis"><div class="lab">${st.est === "p90" ? "Slow night (p90)" : "Typical run"} · server time</div><div class="track" style="width:${W}px">`;
  const step = st.pxh >= 40 ? 2 : st.pxh >= 16 ? 6 : 12;
  for (let d = D0; d < D1; d++) {
    const dt = dateOf(d), we = ["Saturday", "Sunday"].includes(dayName(dt));
    const [a, b] = clip(d * 1440, (d + 1) * 1440);
    ax += `<div class="day${we ? " we" : ""}" style="left:${X(a)}px;width:${(b - a) * px}px">${st.pxh >= 8 && (b - a) * px > 60 ? fmtDay(d) : ""}</div>`;
    for (let h = 0; h < 24; h += step) { const t = d * 1440 + h * 60; if (t > V0 && t < V1 && (h || t !== a)) ax += `<div class="hr" style="left:${X(t)}px">${pad(h)}</div>`; }
  }
  ax += `</div></div>`;
  parts.push(ax);
  // background layer
  let bg = `<div class="bg" style="left:${LABW}px;top:42px;width:${W}px;bottom:0;background-image:repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px ${st.pxh * step}px)">`;
  for (let d = D0; d < D1; d++) {
    const dt = dateOf(d), dn = dayName(dt);
    const [a, b] = clip(d * 1440, (d + 1) * 1440);
    if (dn === "Saturday" || dn === "Sunday") bg += `<div class="we" style="left:${X(a)}px;width:${(b - a) * px}px"></div>`;
    if (st.prod.days.includes(dn) && st.prod.end > st.prod.start) { const [pa, pb] = clip(d * 1440 + st.prod.start, d * 1440 + st.prod.end); if (pb > pa) bg += `<div class="prod" style="left:${X(pa)}px;width:${(pb - pa) * px}px"></div>`; }
    if (d * 1440 > V0) bg += `<div class="dcol" style="left:${X(d * 1440)}px"></div>`;
  }
  bg += `</div>`;
  parts.push(bg);

  for (const row of rows) {
    if (row.kind === "grp") {
      const repo = row.repo;
      const p = row.key ? S.sim.pressure.get(row.key) : null;
      const meta = repo ? `${esc(repo.type || "")}${repo.maxTasks ? ` · ${repo.maxTasks} task slots` : " · no task limit"}` : esc(row.meta || "");
      parts.push(`<div class="row grp"${repo ? ` data-repo="${esc(repo.id)}"` : ""}><div class="lab" title="${repo ? "Edit task slots" : ""}"><div class="n">${esc(repo ? nm(repo) : row.label)}</div><div class="m">${meta}</div></div><div class="track" style="width:${W}px">${p ? heat(p, px) : ""}</div></div>`);
    } else if (row.kind === "host") {
      const h = row.host, segs = S.sim.hostLoad.get(h.id) || [];
      const peak = segs.reduce((m, x) => Math.max(m, x.cores), 0) || 1;
      let hh = `<div class="heat" style="left:0;right:0">`;
      for (const x of segs) {
        if (x.b <= V0 || x.a >= V1) continue;
        const r = h.cores ? x.cores / h.cores : x.cores / peak * 0.6, lv = r > 1 ? 3 : r > 0.6 ? 2 : 1;
        const [a, b] = clip(x.a, x.b);
        hh += `<i class="l${lv}" style="left:${X(a)}px;width:${Math.max(1, (b - a) * px)}px" title="${x.cores.toFixed(1)} cores, ${Math.ceil(x.ram)} GB (${x.pt.toFixed(1)} proxy and ${x.rt.toFixed(1)} repository tasks)"></i>`;
      }
      hh += `</div>`;
      const hw = h.cores || h.ramGB ? `${h.cores || "?"} cores · ${h.ramGB || "?"} GB` : "hardware unknown";
      parts.push(`<div class="row host${S.selHost === h.id ? " sel" : ""}" data-host="${esc(h.id)}"><div class="lab" title="${esc(hostRoles(h).join(", "))}"><div class="n">${esc(nm(h))} · ${esc(hw)}</div><div class="m">${esc(hostRoles(h).join(", ") || "no Veeam roles found")}</div></div><div class="track" style="width:${W}px">${hh}</div></div>`);
    } else if (row.kind === "act") {
      const a = row.act, mx = Math.max(...a.profile) || 1;
      let hh = `<div class="heat" style="left:0;right:0">`;
      for (let t = Math.floor(V0 / 60) * 60; t < V1; t += 60) {
        const d = Math.floor(t / 1440), h = (((t % 1440) + 1440) % 1440) / 60, wd = DAYS.indexOf(dayName(dateOf(d)));
        {
          const v = a.profile[wd * 24 + h]; if (!(v > 0)) continue;
          const [ca, cb] = clip(t, t + 60);
          hh += `<i class="a" style="left:${X(ca)}px;width:${(cb - ca) * px}px;opacity:${(0.2 + 0.8 * Math.min(1, v / mx)).toFixed(2)}" title="${fmtDay(d)} ${pad(h)}:00 · on average ${v.toFixed(1)} running"></i>`;
        }
      }
      hh += `</div>`;
      parts.push(`<div class="row act"><div class="lab" title="${esc(a.label)}"><div class="n">${esc(a.label)}</div><div class="m">${a.sessions || "?"} sessions · median ${dur(a.medianMin || 0)}</div></div><div class="track" style="width:${W}px">${hh}</div></div>`);
    } else if (row.kind === "pool") {
      const p = S.sim.pressure.get(row.res.key);
      parts.push(`<div class="row pool"><div class="lab"><div class="n">${esc(row.res.label)} · ${row.res.cap} slots</div></div><div class="track" style="width:${W}px">${p ? heat(p, px) : ""}</div></div>`);
    } else {
      const job = row.job, off = job.enabled === false || job.scheduleEnabled === false;
      const sel = S.sel === job.id;
      let tr = "";
      const w = job.schedule?.window;
      if (w && w.enabled && w.allowed) {
        for (let d = D0; d < D1; d++) {
          const hrs = w.allowed[dayName(dateOf(d))] || [];
          let s = null;
          for (let h = 0; h <= 24; h++) {
            const den = h < 24 && hrs[h] === false;
            if (den && s == null) s = h;
            if (!den && s != null) { const [ca, cb] = clip(d * 1440 + s * 60, d * 1440 + h * 60); if (cb > ca) tr += `<div class="den" style="left:${X(ca)}px;width:${(cb - ca) * px}px"></div>`; s = null; }
          }
        }
      }
      const draggable = ["daily", "monthly", "periodic"].includes(job.schedule?.type);
      for (const r of S.sim.runsByJob.get(job.id) || []) {
        if (r.end <= V0 || r.start >= V1) continue;
        const x = Math.max(0, X(r.start)), x2 = Math.min(W, X(r.end)), bw = Math.max(2, x2 - x);
        const total = r.end - r.start;
        const flags = r.flags;
        const crit = flags.has("window") || flags.has("self") || flags.has("copy");
        const warnF = !crit && flags.has("prod") && !["periodic", "continuous"].includes(job.schedule?.type) && !isSys(job);
        const cls = ["bar", isSys(job) ? "sys" : "", draggable ? "" : "nodrag", r.est ? "est" : "", crit ? "c-crit" : warnF ? "c-warn" : "", hlJobs.size && !hlJobs.has(job.id) ? "dim" : "", hlJobs.has(job.id) ? "hl" : ""].filter(Boolean).join(" ");
        const segs = r.seg.map(s => `<i class="s ${s.k}" style="width:${(s.m / total) * 100}%"></i>`).join("");
        const label = bw > 70 ? `<span class="t">${esc(r.kind === "active" ? "Full" : r.kind === "synthetic" ? "Synth" : hhmm(r.start))}</span>` : "";
        tr += `<div class="${cls}" data-run="${r.id}" data-job="${esc(job.id)}" style="left:${x}px;width:${bw}px">${segs}${label}</div>`;
      }
      if (off) tr += `<div class="lab-off" style="position:absolute;left:8px;top:6px;font-size:12px;color:var(--faint)">Disabled. Not included in the plan.</div>`;
      parts.push(`<div class="row job${sel ? " sel" : ""}${off ? " off" : ""}" data-jobrow="${esc(job.id)}"><div class="lab"><div class="n">${esc(nm(job))}</div><div class="m">${esc(typeLabel(job))} · ${esc(schedText(job))}</div></div><div class="track" style="width:${W}px">${tr}</div></div>`);
    }
  }
  parts.push(`</div>`);
  tl.innerHTML = parts.join("");
  renderCrumb();
  tl.scrollLeft = keepX; tl.scrollTop = keepY;
}

function renderCrumb() {
  const el = $("#crumb"), st = S.settings, bits = [];
  if (st.view === "infra") bits.push("Showing <b>infrastructure only</b>");
  if (st.view === "jobs") bits.push("Showing <b>jobs only</b>");
  const c = S.selConf ? S.sim.conflicts.find(x => x.id === S.selConf) : null;
  if (c) bits.push(`Highlighting <b>${esc(c.title)}</b>`);
  else if (S.sel) bits.push(`Highlighting <b>${esc(nm(jobById(S.sel)))}</b>`);
  else if (S.selHost) bits.push(`Inspecting <b>${esc(nm((S.data.hosts || []).find(h => h.id === S.selHost)))}</b>`);
  if (!bits.length) { el.hidden = true; return; }
  el.innerHTML = `<span>${bits.join(" · ")}</span><button class="btn" type="button" id="crumbBack">Back to full view</button><span class="note" style="margin:0">or press Esc</span>`;
  el.hidden = false;
  $("#crumbBack").addEventListener("click", resetView);
}
function resetView() {
  S.selConf = null; S.sel = null; S.selHost = null; S.selRepo = null;
  S.settings.view = "all";
  document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.view === "all")));
  setTab("conf"); pane.scrollTop = 0; renderTimeline();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !e.target.closest("input, select, textarea")) resetView(); });

function heat(p, px) {
  if (!p.cap) return "";
  let h = `<div class="heat" style="left:0;right:0">`;
  for (const s of p.segs) {
    const V0 = S.sim.V0, V1 = S.sim.END;
    if (s.b <= V0 || s.a >= V1) continue;
    const r = s.d / p.cap, lv = r > 1 ? 3 : r > 0.6 ? 2 : 1;
    const a = Math.max(V0, s.a), b = Math.min(V1, s.b);
    h += `<i class="l${lv}" style="left:${(a - V0) * px}px;width:${Math.max(1, (b - a) * px)}px" title="${s.d} of ${p.cap} slots"></i>`;
  }
  return h + `</div>`;
}

// ---------- side panel ----------
function setTab(t) {
  S.tab = t;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  renderPane();
}
function renderPane() {
  if (S.tab === "conf") return paneConflicts();
  if (S.tab === "job") return paneJob();
  if (S.tab === "chg") return paneChanges();
  if (S.tab === "repo") return paneRepo();
  if (S.tab === "host") return paneHost();
  return paneSettings();
}

function paneConflicts() {
  const c = S.sim.conflicts;
  if (!c.length) { pane.innerHTML = `<div class="empty">No conflicts in this view. Try <b>Slow night (p90)</b> to test the plan against slower runs.</div>`; return; }
  pane.innerHTML = c.map(x => `
    <div class="cf ${x.sev}${S.selConf === x.id ? " on" : ""}" data-conf="${esc(x.id)}" tabindex="0" role="button" aria-pressed="${S.selConf === x.id}">
      <div class="stripe"></div>
      <div>
        <h4>${esc(x.title)}</h4>
        <p>${esc(x.detail)}</p>
        ${x.occ.length ? `<div class="chips">${x.occ.slice(0, 4).map(o => `<span class="chip">${esc(o.label)}</span>`).join("")}${x.occ.length > 4 ? `<span class="chip">+${x.occ.length - 4} more</span>` : ""}</div>` : ""}
        ${x.fix ? `<div class="fix">${esc(x.fix)}</div>` : ""}
      </div>
    </div>`).join("") + `<p class="note">Times are predicted from run history. Slot pressure assumes each job uses up to one task per machine, capped at the repository limit. Set a different value per job in the Job tab.</p>`;
}

function dayBoxes(name, sel) {
  return `<div class="days">${DAYS.map((d, i) => `<label><input type="checkbox" data-f="${name}" value="${d}"${(sel || []).includes(d) ? " checked" : ""} aria-label="${d}"><span>${DAB[i]}</span></label>`).join("")}</div>`;
}

function paneJob() {
  const job = S.sel ? jobById(S.sel) : null;
  if (!job) { pane.innerHTML = `<div class="empty">Click a job name or a bar in the timeline to inspect it. Drag a bar sideways to try a new start time.</div>`; return; }
  const sc = job.schedule || {}, f = job.fulls || {}, d = durations(job), h = job.history || {}, ov = job.override || {};
  const repo = repoById(job.repositoryId);
  const runs = (S.sim.runsByJob.get(job.id) || []).filter(r => r.start >= S.sim.V0 && r.start < S.sim.END);
  const myConf = S.sim.conflicts.filter(c => c.jobIds.includes(job.id) && c.sev !== "info");
  const others = S.data.jobs.filter(j => j.id !== job.id);
  let sched = "";
  if (sc.type === "daily") sched = `<label class="fld"><span>Start time</span><input type="time" id="fTime" value="${esc(sc.time)}" step="300"></label><div class="fld"><span>Run on</span>${dayBoxes("days", sc.days)}</div>`;
  else if (sc.type === "monthly") sched = `<label class="fld"><span>Start time</span><input type="time" id="fTime" value="${esc((sc.monthly || {}).time || sc.time)}" step="300"><span class="hint">Runs on the ${esc(monthlyText(sc.monthly))}.</span></label>`;
  else if (sc.type === "periodic") sched = `<label class="fld"><span>Run every (minutes)</span><input type="number" id="fEvery" min="5" step="5" value="${esc((sc.periodic || {}).everyMinutes)}"></label><label class="fld"><span>Offset from midnight (minutes)</span><input type="number" id="fOffset" min="0" max="1439" step="5" value="${esc((sc.periodic || {}).offsetMinutes || 0)}"></label>`;
  else if (sc.type === "after") sched = `<label class="fld"><span>Runs after</span><select id="fAfter">${others.map(o => `<option value="${esc(o.id)}"${o.id === sc.afterJobId ? " selected" : ""}>${esc(nm(o))}</option>`).join("")}</select></label>`;
  else if (sc.type === "immediate") sched = `<div class="fld"><span>Copies from</span><div class="hint">${(job.sourceJobIds || []).map(id => esc(nm(jobById(id)))).join(", ") || "No source jobs"}. Starts as soon as each source finishes.</div></div>`;
  const act = f.active || {}, syn = f.synthetic || {};
  pane.innerHTML = `<div class="ed">
    <h3>${esc(nm(job))}</h3>
    <div class="sub">${esc(typeLabel(job))} · ${esc(SCHED_LABEL[sc.type] || sc.type)} · ${esc(nm(repo))} · ${job.objectCount || "?"} objects${job.sourceSizeGB ? ` · ${Math.round(job.sourceSizeGB).toLocaleString()} GB` : ""}</div>
    <div class="stats">
      <div><b>${dur(d.inc)}${d.incEst ? "*" : ""}</b><span>Incremental</span></div>
      <div><b>${dur(d.full)}${d.fullEst ? "*" : ""}</b><span>Full</span></div>
      <div><b>${runs.length}</b><span>Runs in view</span></div>
    </div>
    ${myConf.length ? `<div class="chips" style="margin:-4px 0 12px">${myConf.map(c => `<span class="sev ${c.sev}">${esc(c.type === "slots" ? "Slot pressure" : c.type === "window" ? "Past window" : c.type === "prod" ? "Production hours" : c.type === "copy" ? "Copy too early" : c.type === "self" ? "Overlaps itself" : c.type === "fulls" ? "Full pile-up" : c.type === "act" ? "Background activity" : c.type === "host" ? "Server load" : "Window")}</span>`).join("")}</div>` : ""}
    <label class="fld tog"><input type="checkbox" id="fEnabled"${job.enabled !== false ? " checked" : ""}> Job enabled</label>
    ${sched}
    ${job.type !== "BackupCopy" && !isSys(job) ? `
    <div class="fld"><span>Active full</span>
      <label class="tog"><input type="checkbox" id="fActOn"${act.enabled ? " checked" : ""}> ${act.kind === "monthly" ? `Monthly, ${esc(monthlyText(act.monthly))}` : "Weekly on"}</label>
      ${act.kind !== "monthly" ? dayBoxes("act", act.days) : ""}
    </div>
    <div class="fld"><span>Synthetic full</span>
      <label class="tog"><input type="checkbox" id="fSynOn"${syn.enabled ? " checked" : ""}> Weekly on</label>
      ${dayBoxes("syn", syn.days)}
    </div>` : ""}
    <label class="fld"><span>Repository</span><select id="fRepo">${S.data.repositories.map(r => `<option value="${esc(r.id)}"${r.id === job.repositoryId ? " selected" : ""}>${esc(nm(r))} (${r.maxTasks || "no"} slots)</option>`).join("")}</select></label>
    <label class="fld"><span>Parallel tasks</span><input type="number" id="fTasks" min="1" placeholder="${tasksFor({ objectCount: job.objectCount }, repo && repo.maxTasks)} (automatic)" value="${esc(ov.tasks ?? "")}"><span class="hint">How many slots this job takes while it runs.</span></label>
    <label class="fld"><span>Incremental duration (minutes)</span><input type="number" id="fDur" min="1" placeholder="${Math.round(d.incEst ? d.inc : (S.settings.est === "p90" ? (h.incP90Min ?? d.inc) : (h.incMedianMin ?? d.inc)))} (from ${d.incEst ? "estimate" : "history"})" value="${esc(ov.durationMin ?? "")}"><span class="hint">${h.runs ? `${h.runs} runs in history. Median ${dur(h.incMedianMin || 0)}, p90 ${dur(h.incP90Min || 0)}.` : "No history. Values marked * are estimates."}</span></label>
    <div class="acts">
      <button class="btn" type="button" id="fReset">Reset this job</button>
      <button class="btn ghost" type="button" id="fClose">Close</button>
    </div>
  </div>`;
  bindJobEditor(job);
}

function bindJobEditor(job) {
  const commit = () => { render(); };
  const on = (id, ev, fn) => { const el = $("#" + id, pane); if (el) el.addEventListener(ev, fn); };
  on("fEnabled", "change", e => { job.enabled = e.target.checked; commit(); });
  on("fTime", "change", e => { if (!e.target.value) return; if (job.schedule.type === "monthly") { job.schedule.monthly = job.schedule.monthly || {}; job.schedule.monthly.time = e.target.value; } else job.schedule.time = e.target.value; commit(); });
  on("fEvery", "change", e => { job.schedule.periodic = job.schedule.periodic || {}; job.schedule.periodic.everyMinutes = Math.max(5, +e.target.value || 60); commit(); });
  on("fOffset", "change", e => { job.schedule.periodic = job.schedule.periodic || {}; job.schedule.periodic.offsetMinutes = Math.max(0, +e.target.value || 0); commit(); });
  on("fAfter", "change", e => { job.schedule.afterJobId = e.target.value; commit(); });
  on("fActOn", "change", e => { job.fulls = job.fulls || {}; job.fulls.active = job.fulls.active || { kind: "weekly", days: [] }; job.fulls.active.enabled = e.target.checked; commit(); });
  on("fSynOn", "change", e => { job.fulls = job.fulls || {}; job.fulls.synthetic = job.fulls.synthetic || { days: [] }; job.fulls.synthetic.enabled = e.target.checked; commit(); });
  on("fRepo", "change", e => { job.repositoryId = e.target.value; commit(); });
  on("fTasks", "change", e => { job.override = job.override || {}; job.override.tasks = e.target.value === "" ? null : Math.max(1, +e.target.value); commit(); });
  on("fDur", "change", e => { job.override = job.override || {}; job.override.durationMin = e.target.value === "" ? null : Math.max(1, +e.target.value); commit(); });
  on("fReset", "click", () => { const o = origJob(job.id); Object.keys(job).forEach(k => delete job[k]); Object.assign(job, clone(o)); commit(); });
  on("fClose", "click", () => { S.sel = null; setTab("conf"); render(); });
  pane.querySelectorAll("input[data-f]").forEach(cb => cb.addEventListener("change", () => {
    const vals = [...pane.querySelectorAll(`input[data-f="${cb.dataset.f}"]:checked`)].map(x => x.value);
    if (cb.dataset.f === "days") job.schedule.days = vals;
    if (cb.dataset.f === "act") { job.fulls.active = job.fulls.active || { kind: "weekly" }; job.fulls.active.kind = "weekly"; job.fulls.active.days = vals; if (vals.length) job.fulls.active.enabled = true; }
    if (cb.dataset.f === "syn") { job.fulls.synthetic = job.fulls.synthetic || {}; job.fulls.synthetic.days = vals; if (vals.length) job.fulls.synthetic.enabled = true; }
    commit();
  }));
}

function paneRepo() {
  const repo = S.selRepo ? repoById(S.selRepo) : null;
  if (!repo) return setTab("conf");
  const o = S.orig.repositories.find(r => r.id === repo.id) || {};
  const jobs = S.data.jobs.filter(j => j.repositoryId === repo.id);
  pane.innerHTML = `<div class="ed"><h3>${esc(nm(repo))}</h3><div class="sub">${esc(repo.type || "Repository")} · ${jobs.length} jobs${repo.extents ? ` · ${repo.extents.length} extents` : ""}</div>
    <label class="fld"><span>Concurrent task limit</span><input type="number" id="rTasks" min="1" value="${esc(repo.maxTasks || "")}"><span class="hint">Was ${o.maxTasks || "unlimited"} in the export. Raise it only if the repository has the CPU, RAM and disk throughput to match.</span></label>
    <div class="acts"><button class="btn" type="button" id="rReset">Reset</button><button class="btn ghost" type="button" id="rClose">Close</button></div></div>`;
  $("#rTasks", pane).addEventListener("change", e => { repo.maxTasks = Math.max(1, +e.target.value || 1); render(); });
  $("#rReset", pane).addEventListener("click", () => { repo.maxTasks = o.maxTasks; render(); });
  $("#rClose", pane).addEventListener("click", () => { S.selRepo = null; setTab("conf"); render(); });
}

function paneHost() {
  const h = S.selHost ? (S.data.hosts || []).find(x => x.id === S.selHost) : null;
  if (!h) return setTab("conf");
  const o = (S.orig.hosts || []).find(x => x.id === h.id) || {};
  const segs = (S.sim.hostLoad.get(h.id) || []).filter(x => x.b > S.sim.V0 && x.a < S.sim.END);
  const pk = segs.reduce((m, x) => x.cores > m.cores ? x : m, { cores: 0, ram: 0, pt: 0, rt: 0, a: 0 });
  const pkR = segs.reduce((m, x) => Math.max(m, x.ram), 0);
  pane.innerHTML = `<div class="ed"><h3>${esc(nm(h))}</h3><div class="sub">${esc(h.os || "Server")}${h.isBackupServer ? " · backup server" : ""}</div>
    <div class="stats"><div><b>${pk.cores.toFixed(1)}</b><span>Peak cores</span></div><div><b>${Math.ceil(pkR)} GB</b><span>Peak RAM</span></div><div><b>${pk.cores ? fmtAt(pk.a).slice(0, 10) : "None"}</b><span>Peak at</span></div></div>
    <div class="fld"><span>Veeam roles</span><div class="hint">${esc(hostRoles(h).join(", ") || "None found in the export")}</div></div>
    <label class="fld"><span>CPU cores</span><input type="number" id="hCores" min="1" value="${esc(h.cores ?? "")}" placeholder="unknown"></label>
    <label class="fld"><span>RAM (GB)</span><input type="number" id="hRam" min="1" value="${esc(h.ramGB ?? "")}" placeholder="unknown"><span class="hint">${o.cores || o.ramGB ? `Export said ${o.cores || "?"} cores and ${o.ramGB || "?"} GB.` : "The export had no hardware for this server."} Sizing rules are under Assumptions.</span></label>
    <div class="acts"><button class="btn" type="button" id="hReset">Reset</button><button class="btn ghost" type="button" id="hClose">Close</button></div></div>`;
  $("#hCores", pane).addEventListener("change", e => { h.cores = e.target.value === "" ? null : Math.max(1, +e.target.value); render(); });
  $("#hRam", pane).addEventListener("change", e => { h.ramGB = e.target.value === "" ? null : Math.max(1, +e.target.value); render(); });
  $("#hReset", pane).addEventListener("click", () => { h.cores = o.cores ?? null; h.ramGB = o.ramGB ?? null; render(); });
  $("#hClose", pane).addEventListener("click", () => { S.selHost = null; setTab("conf"); render(); });
}

function changes() {
  if (!S.orig) return [];
  const out = [];
  for (const j of S.data.jobs) {
    const o = origJob(j.id); if (!o) continue;
    const n = nm(j), sc = j.schedule || {}, os = o.schedule || {};
    if ((j.enabled !== false) !== (o.enabled !== false)) out.push({ who: n, what: j.enabled !== false ? "Enable the job" : "Disable the job" });
    if (sc.time !== os.time && sc.type === "daily") out.push({ who: n, what: "Start time", from: os.time, to: sc.time });
    if (sc.type === "monthly" && (sc.monthly || {}).time !== (os.monthly || {}).time) out.push({ who: n, what: "Start time", from: (os.monthly || {}).time, to: (sc.monthly || {}).time });
    if (JSON.stringify(sc.days || []) !== JSON.stringify(os.days || [])) out.push({ who: n, what: "Run days", from: dayList(os.days), to: dayList(sc.days) });
    if (JSON.stringify(sc.periodic || {}) !== JSON.stringify(os.periodic || {})) out.push({ who: n, what: "Periodic schedule", from: `every ${(os.periodic || {}).everyMinutes}m +${(os.periodic || {}).offsetMinutes || 0}m`, to: `every ${(sc.periodic || {}).everyMinutes}m +${(sc.periodic || {}).offsetMinutes || 0}m` });
    if (sc.afterJobId !== os.afterJobId) out.push({ who: n, what: "Run after", from: nm(jobById(os.afterJobId)), to: nm(jobById(sc.afterJobId)) });
    const fa = (j.fulls || {}).active || {}, oa = (o.fulls || {}).active || {};
    if (!!fa.enabled !== !!oa.enabled || JSON.stringify(fa.days || []) !== JSON.stringify(oa.days || [])) out.push({ who: n, what: "Active full", from: oa.enabled ? (oa.kind === "monthly" ? monthlyText(oa.monthly) : dayList(oa.days)) : "off", to: fa.enabled ? (fa.kind === "monthly" ? monthlyText(fa.monthly) : dayList(fa.days)) : "off" });
    const fs = (j.fulls || {}).synthetic || {}, osy = (o.fulls || {}).synthetic || {};
    if (!!fs.enabled !== !!osy.enabled || JSON.stringify(fs.days || []) !== JSON.stringify(osy.days || [])) out.push({ who: n, what: "Synthetic full", from: osy.enabled ? dayList(osy.days) : "off", to: fs.enabled ? dayList(fs.days) : "off" });
    if (j.repositoryId !== o.repositoryId) out.push({ who: n, what: "Repository", from: nm(repoById(o.repositoryId)), to: nm(repoById(j.repositoryId)) });
    const ov = j.override || {};
    if (ov.tasks != null) out.push({ who: n, what: "Assumed parallel tasks", to: String(ov.tasks), note: "planning assumption" });
    if (ov.durationMin != null) out.push({ who: n, what: "Assumed incremental duration", to: dur(ov.durationMin), note: "planning assumption" });
  }
  for (const h of (S.data.hosts || [])) {
    const o = (S.orig.hosts || []).find(x => x.id === h.id);
    if (o && (o.cores !== h.cores || o.ramGB !== h.ramGB)) out.push({ who: nm(h), what: "Server hardware", to: `${h.cores || "?"} cores, ${h.ramGB || "?"} GB`, note: "planning assumption" });
  }
  for (const r of S.data.repositories) {
    const o = S.orig.repositories.find(x => x.id === r.id);
    if (o && +o.maxTasks !== +r.maxTasks) out.push({ who: nm(r), what: "Concurrent task limit", from: String(o.maxTasks || "unlimited"), to: String(r.maxTasks) });
  }
  return out;
}

function planText() {
  const ch = changes();
  const c = S.sim.conflicts;
  const lines = [`# Nightshift change plan`, ``, `Server ${S.settings.anon ? "vbr-server" : (S.data.server || {}).name || "VBR"}, view from ${S.settings.start} for ${S.settings.offset ? "one night" : S.settings.horizon + (S.settings.horizon === 1 ? " day" : " days")}, ${S.settings.est === "p90" ? "slow night (p90)" : "typical"} durations.`, ``];
  ch.filter(x => !x.note).forEach(x => lines.push(`- [ ] **${x.who}** · ${x.what}${x.from != null ? `: ${x.from} → ${x.to}` : x.to ? `: ${x.to}` : ""}`));
  const asm = ch.filter(x => x.note);
  if (asm.length) { lines.push(``, `Planning assumptions (not VBR settings)`); asm.forEach(x => lines.push(`- ${x.who} · ${x.what} ${x.to}`)); }
  lines.push(``, `Conflicts left after these changes: ${c.filter(x => x.sev === "crit").length} critical, ${c.filter(x => x.sev === "warn").length} warning.`);
  return lines.join("\n");
}

function paneChanges() {
  const ch = changes();
  if (!ch.length) { pane.innerHTML = `<div class="empty">No changes yet. Drag a bar to a new start time, or edit a job in the Job tab. Every change is listed here so you can apply it in VBR afterwards.</div>`; return; }
  pane.innerHTML = ch.map(x => `<div class="ch"><b>${esc(x.who)}</b> · ${esc(x.what)}${x.note ? ` <span class="pill">${esc(x.note)}</span>` : ""}<div class="d">${x.from != null ? `${esc(x.from)} → ${esc(x.to)}` : esc(x.to || "")}</div></div>`).join("") +
    `<div class="acts" style="margin-top:12px"><button class="btn primary" type="button" id="cCopy">Copy as checklist</button>
     ${S.confirmReset ? `<span class="confirm">Undo every change? <button class="btn danger" type="button" id="cYes">Yes, reset</button><button class="btn ghost" type="button" id="cNo">Keep</button></span>` : `<button class="btn ghost" type="button" id="cReset">Reset all</button>`}</div>
     <textarea class="out" id="cOut" readonly aria-label="Change plan">${esc(planText())}</textarea>
     <p class="note">Nightshift never writes to VBR. Apply the checklist in the console or with PowerShell, then run the collector again to confirm.</p>`;
  $("#cCopy", pane).addEventListener("click", e => {
    const t = planText(), btn = e.currentTarget;
    const done = () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy as checklist", 1500); };
    const fallback = () => { const ta = $("#cOut", pane); ta.focus(); ta.select(); btn.textContent = "Press Ctrl+C to copy"; };
    try { navigator.clipboard.writeText(t).then(done, fallback); } catch (_) { fallback(); }
  });
  const r = $("#cReset", pane); if (r) r.addEventListener("click", () => { S.confirmReset = true; paneChanges(); });
  const y = $("#cYes", pane); if (y) y.addEventListener("click", () => { S.data = clone(S.orig); S.confirmReset = false; render(); });
  const n = $("#cNo", pane); if (n) n.addEventListener("click", () => { S.confirmReset = false; paneChanges(); });
}

function paneSettings() {
  const st = S.settings;
  pane.innerHTML = `<div class="ed">
    <div class="fld"><span>Production hours</span>
      <div style="display:flex;gap:8px;align-items:center"><input type="time" id="sPs" value="${hhmm(st.prod.start)}" step="900" style="width:auto"> to <input type="time" id="sPe" value="${hhmm(st.prod.end)}" step="900" style="width:auto"></div>
      ${dayBoxes("prod", st.prod.days)}
    </div>
    <label class="fld"><span>Throughput for jobs without history (MB/s)</span><input type="number" id="sTp" min="10" value="${st.throughput}"></label>
    <label class="fld"><span>Incremental as % of a full (no history)</span><input type="number" id="sInc" min="1" max="100" value="${st.incPct}"></label>
    <label class="fld"><span>Synthetic full transform, % of a full</span><input type="number" id="sSyn" min="0" max="200" value="${st.synthPct}"><span class="hint">Fast-clone repositories (XFS, ReFS) usually need far less.</span></label>
    <label class="fld"><span>Health check, % of a full</span><input type="number" id="sHc" min="0" max="200" value="${st.healthPct}"></label>
    <div class="fld"><span>Server sizing per task</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <label class="hint">Proxy cores per task<input type="number" id="sPc" min="0.1" step="0.1" value="${st.proxyCores}"></label>
        <label class="hint">Proxy GB RAM per task<input type="number" id="sPr" min="0.1" step="0.5" value="${st.proxyRam}"></label>
        <label class="hint">Repository tasks per core<input type="number" id="sRt" min="1" step="1" value="${st.repoTasksPerCore}"></label>
        <label class="hint">Repository GB RAM per core<input type="number" id="sRr" min="0.5" step="0.5" value="${st.repoRamPerCore}"></label>
      </div>
      <span class="hint">Defaults follow the Veeam best practice guide. Gateways count as repository tasks.</span>
    </div>
    <p class="note">Nightshift predicts. It reads schedules and real run times from the export, then lays them out against task slots, backup windows and your production hours. Background activity is drawn from what ran in the past, because VBR starts retention, maintenance and scans on its own. It doesn't model storage latency control, network throttling or retries, so treat a clean plan as likely, not guaranteed.</p>
  </div>`;
  const upd = () => {
    st.prod.start = parseHM($("#sPs", pane).value) ?? st.prod.start; st.prod.end = parseHM($("#sPe", pane).value) ?? st.prod.end;
    st.throughput = Math.max(10, +$("#sTp", pane).value || 250); st.incPct = Math.max(1, +$("#sInc", pane).value || 15);
    st.synthPct = Math.max(0, +$("#sSyn", pane).value); st.healthPct = Math.max(0, +$("#sHc", pane).value);
    st.proxyCores = Math.max(0.1, +$("#sPc", pane).value || 1); st.proxyRam = Math.max(0.1, +$("#sPr", pane).value || 2);
    st.repoTasksPerCore = Math.max(1, +$("#sRt", pane).value || 3); st.repoRamPerCore = Math.max(0.5, +$("#sRr", pane).value || 4);
    render();
  };
  pane.querySelectorAll("input").forEach(i => i.addEventListener("change", e => {
    if (e.target.dataset.f === "prod") st.prod.days = [...pane.querySelectorAll('input[data-f="prod"]:checked')].map(x => x.value);
    upd();
  }));
}

// ---------- interactions ----------
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
pane.addEventListener("click", e => {
  const c = e.target.closest("[data-conf]"); if (!c) return;
  focusConflict(c.dataset.conf);
});
pane.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-conf]")) { e.preventDefault(); focusConflict(e.target.dataset.conf); } });

function focusConflict(id) {
  S.selConf = S.selConf === id ? null : id;
  const c = S.sim.conflicts.find(x => x.id === id);
  renderTimeline(); paneConflicts();
  const on = pane.querySelector(".cf.on"); if (on) pane.scrollTop = Math.max(0, on.offsetTop - pane.offsetTop - 12); // scroll only the panel, not the page
  if (S.selConf && c) scrollToTime(c.focus, c.jobIds[0], c.hostId);
}
function scrollToTime(min, jobId, hostId) {
  const px = S.settings.pxh / 60;
  const row = jobId ? tl.querySelector(`[data-jobrow="${CSS.escape(jobId)}"]`) : hostId ? tl.querySelector(`[data-host="${CSS.escape(hostId)}"]`) : null;
  const top = row ? Math.max(0, row.offsetTop - tl.clientHeight / 2) : tl.scrollTop;
  tl.scrollTo({ left: Math.max(0, (min - S.sim.V0) * px - 160), top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  if (jobId) {
    if (row) {
      const bar = [...row.querySelectorAll(".bar")].find(b => Math.abs(parseFloat(b.style.left) - Math.max(0, (min - S.sim.V0) * px)) < 2);
      if (bar) { bar.classList.add("flash"); setTimeout(() => bar.classList.remove("flash"), 1300); }
    }
  }
}
function selectJob(id) { S.sel = id; S.selConf = null; S.tab = "job"; document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === "job"))); renderTimeline(); renderPane(); }

tl.addEventListener("click", e => {
  if (dragState && dragState.moved) return;
  const lab = e.target.closest(".row.job .lab"); if (lab) return selectJob(lab.parentElement.dataset.jobrow);
  const hl = e.target.closest(".row.host .lab"); if (hl) { S.selHost = hl.parentElement.dataset.host; S.tab = "host"; document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", "false")); return renderPane(); }
  const g = e.target.closest(".row.grp[data-repo] .lab"); if (g) { S.selRepo = g.parentElement.dataset.repo; S.tab = "repo"; document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", "false")); return renderPane(); }
});

// tooltip
tl.addEventListener("pointermove", e => {
  if (dragState) return;
  const bar = e.target.closest(".bar");
  if (!bar) { tip.hidden = true; return; }
  const r = S.sim.all.find(x => x.id === +bar.dataset.run); if (!r) return;
  const job = jobById(r.jobId), repo = repoById(job.repositoryId);
  const kind = r.kind === "active" ? "Active full" : r.kind === "synthetic" ? "Synthetic full" : "Incremental";
  const warn = [];
  if (r.flags.has("window")) warn.push("Runs outside its backup window");
  if (r.flags.has("self")) warn.push("Previous run still busy");
  if (r.flags.has("copy")) warn.push("Source job still running");
  if (r.flags.has("slots")) warn.push("Repository or proxy slots oversubscribed");
  if (r.flags.has("prod")) warn.push("Runs into production hours");
  if (r.flags.has("fulls")) warn.push("Shares the night with other fulls");
  tip.innerHTML = `<b>${esc(nm(job))}</b><div class="r"><span>${kind}${r.health ? " + health check" : ""}</span><span>${r.est ? "estimated" : "from history"}</span></div>
    <div class="r"><span>Start</span><span class="mono">${fmtAt(r.start)}</span></div>
    <div class="r"><span>End</span><span class="mono">${fmtAt(r.end)}</span></div>
    <div class="r"><span>Duration</span><span class="mono">${dur(r.end - r.start)}</span></div>
    <div class="r"><span>Slots used</span><span class="mono">${tasksFor(job, repo && repo.maxTasks)}${repo && repo.maxTasks ? ` of ${repo.maxTasks}` : ""}</span></div>
    ${r.src ? `<div class="r"><span>Triggered by</span><span>${esc(nm(jobById(r.src)))}</span></div>` : ""}
    ${warn.map(w => `<div class="w">${esc(w)}</div>`).join("")}
    ${!bar.classList.contains("nodrag") ? `<div style="opacity:.6;margin-top:4px">Drag sideways to move the start time</div>` : ""}`;
  tip.hidden = false;
  const x = Math.min(window.innerWidth - tip.offsetWidth - 12, e.clientX + 14), y = Math.min(window.innerHeight - tip.offsetHeight - 12, e.clientY + 14);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
tl.addEventListener("pointerleave", () => { tip.hidden = true; });

// dragging a bar shifts the job's start time (snaps to 15 minutes)
let dragState = null;
tl.addEventListener("pointerdown", e => {
  const bar = e.target.closest(".bar"); if (!bar || e.button !== 0) return;
  const job = jobById(bar.dataset.job);
  dragState = { x0: e.clientX, job, bars: [...tl.querySelectorAll(`.bar[data-job="${CSS.escape(job.id)}"]`)], moved: false, can: !bar.classList.contains("nodrag"), runId: +bar.dataset.run, pid: e.pointerId };
  if (dragState.can) bar.setPointerCapture(e.pointerId);
});
tl.addEventListener("pointermove", e => {
  if (!dragState || !dragState.can) return;
  const dx = e.clientX - dragState.x0;
  if (Math.abs(dx) > 4) dragState.moved = true;
  if (!dragState.moved) return;
  const px = S.settings.pxh / 60, snap = Math.round(dx / px / 15) * 15;
  dragState.snap = snap;
  dragState.bars.forEach(b => { b.style.transform = `translateX(${snap * px}px)`; b.classList.add("dragging"); });
  tip.hidden = false;
  const r = S.sim.all.find(x => x.id === dragState.runId);
  tip.innerHTML = `<b>${esc(nm(dragState.job))}</b><div class="r"><span>New start</span><span class="mono">${hhmm(r.start + snap)}</span></div><div class="r"><span>Shift</span><span class="mono">${snap >= 0 ? "+" : "−"}${dur(Math.abs(snap))}</span></div>`;
  tip.style.left = Math.min(window.innerWidth - 200, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
const endDrag = () => {
  if (!dragState) return;
  const ds = dragState;
  setTimeout(() => { dragState = null; }, 0);
  tip.hidden = true;
  if (!ds.moved) { selectJob(ds.job.id); return; }
  if (!ds.can || !ds.snap) { renderTimeline(); return; }
  shiftJob(ds.job, ds.snap);
  S.sel = ds.job.id;
  render();
};
tl.addEventListener("pointerup", endDrag);
tl.addEventListener("pointercancel", () => { if (dragState) { dragState = null; renderTimeline(); } });

function shiftJob(job, delta) {
  const sc = job.schedule;
  if (sc.type === "periodic") { sc.periodic.offsetMinutes = (((+(sc.periodic.offsetMinutes || 0) + delta) % 1440) + 1440) % 1440; return; }
  if (sc.type === "monthly") { sc.monthly = sc.monthly || {}; const t = parseHM(sc.monthly.time || sc.time) + delta; sc.monthly.time = hhmm(t); return; }
  const t = parseHM(sc.time) + delta, shift = Math.floor(t / 1440);
  sc.time = hhmm(t);
  if (shift && sc.days) sc.days = DAYS.filter(d => sc.days.includes(DAYS[(DAYS.indexOf(d) - shift + 70) % 7]));
}

// controls
$("#startDate").addEventListener("change", e => { if (e.target.value) { S.settings.start = e.target.value; render(); } });
function setZoom(z) { S.settings.pxh = z; document.querySelectorAll("[data-zoom]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.zoom === z))); }
$("#horizon").addEventListener("change", e => {
  const v = e.target.value, st = S.settings;
  st.horizon = v === "night" ? 1 : +v; st.offset = v === "night" ? 720 : 0;
  if (st.horizon <= 1 && st.pxh < 40) setZoom(40);          // a single day reads best at hour level
  else if (st.horizon >= 7 && st.pxh > 16) setZoom(16);
  render();
  if (st.offset) tl.scrollLeft = 0; else if (st.horizon <= 3) scrollToEvening();
});
function shiftStart(days) {
  const d = new Date(S.settings.start + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + days);
  S.settings.start = d.toISOString().slice(0, 10); $("#startDate").value = S.settings.start; render();
}
$("#dPrev").addEventListener("click", () => shiftStart(-1));
$("#dNext").addEventListener("click", () => shiftStart(1));
$("#dToday").addEventListener("click", () => { const n = new Date(); S.settings.start = new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())).toISOString().slice(0, 10); $("#startDate").value = S.settings.start; render(); });
document.querySelectorAll("[data-est]").forEach(b => b.addEventListener("click", () => { S.settings.est = b.dataset.est; document.querySelectorAll("[data-est]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); }));
function setView(v) { S.settings.view = v; document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.view === v))); renderTimeline(); }
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
document.querySelectorAll("[data-grp]").forEach(b => b.addEventListener("click", () => { S.settings.group = b.dataset.grp; function setView(v) { S.settings.view = v; document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.view === v))); renderTimeline(); }
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
document.querySelectorAll("[data-grp]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); renderTimeline(); }));
document.querySelectorAll("[data-zoom]").forEach(b => b.addEventListener("click", () => {
  const old = S.settings.pxh, mid = (tl.scrollLeft + tl.clientWidth / 2 - LABW) / old;
  S.settings.pxh = +b.dataset.zoom; document.querySelectorAll("[data-zoom]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderTimeline(); tl.scrollLeft = Math.max(0, mid * S.settings.pxh - tl.clientWidth / 2 + LABW);
}));
$("#anon").addEventListener("change", e => { S.settings.anon = e.target.checked; buildAnon(); render(); });
$("#showOff").addEventListener("change", e => { S.settings.showOff = e.target.checked; renderTimeline(); });

function scrollToEvening() {
  // open on the first evening so the backup window is in view
  requestAnimationFrame(() => { tl.scrollLeft = Math.max(0, (17 * 60 - S.sim.V0) * S.settings.pxh / 60); });
}

// loading data
function showError(msg) { const b = $("#banner"); b.textContent = msg; b.hidden = !msg; }
function load(data, isSample) {
  if (!data || typeof data !== "object" || !String(data.schema || "").startsWith("nightshift/") || !Array.isArray(data.jobs)) {
    showError("That file isn't a Nightshift export. Run Collect-NightshiftData.ps1 on your VBR server and open the JSON it writes.");
    return;
  }
  showError("");
  data.repositories = data.repositories || []; data.proxies = data.proxies || []; data.hosts = data.hosts || []; data.activity = data.activity || [];
  data.repositories.forEach(r => { if (Array.isArray(r.extents)) r.extents = r.extents.map(e => typeof e === "string" ? { name: e } : e); });
  data.jobs.forEach(j => { j.schedule = j.schedule || { type: "none" }; j.fulls = j.fulls || {}; j.healthCheck = j.healthCheck || { enabled: false }; });
  S.data = data; S.orig = clone(data); S.isSample = !!isSample; S.sel = null; S.selConf = null; S.selRepo = null; S.selHost = null;
  buildAnon();
  render();
  // open on the first evening so the backup window is in view
  scrollToEvening();
}
$("#btnOpen").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => readFile(e.target.files[0]));
$("#btnSample").addEventListener("click", () => load(JSON.parse($("#sample-data").textContent), true));
function readFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { load(JSON.parse(r.result), false); } catch (err) { showError("Couldn't read that file as JSON. " + err.message); } };
  r.readAsText(f);
}
let dragDepth = 0;
window.addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { dragDepth++; $("#drop").hidden = false; } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#drop").hidden = true; });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("#drop").hidden = true; readFile(e.dataTransfer.files[0]); });

// boot: start on the Monday of the current week
const now = new Date();
const mon = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
mon.setUTCDate(mon.getUTCDate() - ((mon.getUTCDay() + 6) % 7));
S.settings.start = mon.toISOString().slice(0, 10);
$("#startDate").value = S.settings.start;
load(JSON.parse($("#sample-data").textContent), true);
window.__nightshift = S; // for debugging and tests
})();
</script>
