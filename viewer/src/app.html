<title>Nightshift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control room. Summary strip on top, a scrollable night-by-night timeline on the left,
   a working panel (conflicts, job editor, changes) on the right. Daylight hours tinted warm,
   night left clear, so the backup window reads as the empty space between two warm bands. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #F8F9FC;
  --ink: #17202C;
  --muted: #5A6577;
  --faint: #8A94A6;
  --line: #DCE1EA;
  --grid: rgba(23, 32, 44, .055);
  --accent: #2C5BD0;
  --accent-deep: #183A8F;
  --accent-soft: #CBD7F6;
  --accent-ink: #FFFFFF;
  --synth: #7B93D8;
  --day: rgba(244, 178, 64, .13);
  --weekend: rgba(23, 32, 44, .035);
  --denied: rgba(23, 32, 44, .10);
  --crit: #C2362B;
  --crit-soft: #FBE3E0;
  --warn: #A86A12;
  --warn-soft: #FBEFD9;
  --ok: #2E7D52;
  --info: #5A6577;
  --info-soft: #E8ECF2;
  --heat-1: #DCE5FA;
  --heat-2: #9DB5EE;
  --heat-3: #C2362B;
  --sys: #2F8A84;
  --act: #7A5CC2;
  --shadow: 0 1px 2px rgba(23, 32, 44, .06), 0 4px 16px rgba(23, 32, 44, .06);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #151C27; --surface-2: #111823; --ink: #E5EAF2; --muted: #98A3B5; --faint: #6D7889;
    --line: #253041; --grid: rgba(229, 234, 242, .05); --accent: #7C9EFF; --accent-deep: #4F73DE; --accent-soft: #22325A;
    --accent-ink: #0B1020; --synth: #5468A8; --day: rgba(244, 178, 64, .08); --weekend: rgba(229, 234, 242, .025);
    --denied: rgba(229, 234, 242, .08); --crit: #FF6F62; --crit-soft: #3A1C1A; --warn: #E9B252; --warn-soft: #3A2C14;
    --ok: #5CC28C; --info: #98A3B5; --info-soft: #1D2633; --heat-1: #1E2B47; --heat-2: #3A5498; --heat-3: #FF6F62; --sys: #4FC1B8; --act: #A58BEA;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #151C27; --surface-2: #111823; --ink: #E5EAF2; --muted: #98A3B5; --faint: #6D7889;
  --line: #253041; --grid: rgba(229, 234, 242, .05); --accent: #7C9EFF; --accent-deep: #4F73DE; --accent-soft: #22325A;
  --accent-ink: #0B1020; --synth: #5468A8; --day: rgba(244, 178, 64, .08); --weekend: rgba(229, 234, 242, .025);
  --denied: rgba(229, 234, 242, .08); --crit: #FF6F62; --crit-soft: #3A1C1A; --warn: #E9B252; --warn-soft: #3A2C14;
  --ok: #5CC28C; --info: #98A3B5; --info-soft: #1D2633; --heat-1: #1E2B47; --heat-2: #3A5498; --heat-3: #FF6F62; --sys: #4FC1B8; --act: #A58BEA;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-size: 26px; letter-spacing: -.01em; margin: 0; line-height: 1; }
.brand h1 .moon { display: inline-block; width: .62em; height: .62em; border-radius: 50%; margin-right: .18em;
  box-shadow: inset -.17em -.05em 0 0 var(--accent); transform: translateY(-.04em) rotate(-20deg); }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.server { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; background: var(--info-soft);
  color: var(--muted); font-size: 12px; white-space: nowrap; }
.pill.sample { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.top .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--crit); }

/* Summary */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; }
.tile.tap { cursor: pointer; }
.tile.tap:hover { border-color: var(--accent); }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--f-display); font-size: 24px; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .v small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.tile .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sev-row { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.sev { font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.sev.crit { background: var(--crit-soft); color: var(--crit); }
.sev.warn { background: var(--warn-soft); color: var(--warn); }
.sev.info { background: var(--info-soft); color: var(--info); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; font-size: 13px; }
.controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.controls select, .controls input[type="date"] { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.dnav { display: inline-flex; align-items: center; gap: 2px; }
.dnav .btn { padding: 4px 9px; }
.crumb { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; padding: 7px 8px 7px 14px;
  background: var(--accent-soft); border-radius: 10px; font-size: 13px; }
.crumb b { font-weight: 600; }
.crumb .btn { margin-left: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; margin-left: auto; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.inc { background: var(--accent); }
.sw.full { background: var(--accent-deep); }
.sw.synth { background: repeating-linear-gradient(135deg, var(--synth) 0 3px, var(--accent) 3px 6px); }
.sw.health { background: repeating-linear-gradient(90deg, var(--ok) 0 2px, transparent 2px 4px); border: 1px solid var(--ok); }
.sw.day { background: var(--day); border: 1px solid rgba(244, 178, 64, .45); }
.sw.swden { background: repeating-linear-gradient(135deg, var(--denied) 0 3px, transparent 3px 6px); border: 1px solid var(--line); }

/* Main split */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }

/* Timeline */
.tl-wrap { position: relative; }
.tl { overflow: auto; max-height: calc(100vh - 230px); min-height: 420px; border-radius: 10px; position: relative; overscroll-behavior: contain; }
.tl-inner { position: relative; }
.row { display: flex; position: relative; }
.lab { position: sticky; left: 0; z-index: 3; flex: 0 0 var(--labw); width: var(--labw); background: var(--surface);
  border-right: 1px solid var(--line); padding: 0 10px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.lab .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.lab .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--faint); }
.track { position: relative; flex: 0 0 auto; }
.row.job { height: 30px; border-bottom: 1px solid var(--grid); }
.row.job .lab { cursor: pointer; }
.row.job .lab:hover .n { color: var(--accent); }
.row.job.sel .lab { box-shadow: inset 3px 0 0 var(--accent); }
.row.job.sel .lab .n { font-weight: 600; }
.row.job.off .lab .n { color: var(--faint); text-decoration: line-through; }
.row.grp { height: 36px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.row.grp .lab { background: var(--surface-2); cursor: pointer; }
.row.grp .lab .n { font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
.row.grp .lab .m { font-size: 11.5px; }
.row.pool { height: 26px; }
.row.pool .lab .n { font-size: 12px; color: var(--muted); }
.axis { position: sticky; top: 0; z-index: 5; height: 42px; background: var(--surface); border-bottom: 1px solid var(--line); }
.axis .lab { z-index: 6; justify-content: flex-end; padding-bottom: 6px; font-size: 11px; color: var(--faint); }
.axis .day { position: absolute; top: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; padding-left: 6px; border-left: 1px solid var(--line); height: 36px; }
.axis .day.we { color: var(--muted); }
.axis .hr { position: absolute; bottom: 4px; font-size: 10.5px; color: var(--faint); font-family: var(--f-mono); transform: translateX(-50%); }
.bg { position: absolute; z-index: 0; pointer-events: none; }
.bg .dcol { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.bg .we { position: absolute; top: 0; bottom: 0; background: var(--weekend); }
.bg .prod { position: absolute; top: 0; bottom: 0; background: var(--day); }
.den { position: absolute; top: 3px; bottom: 3px; background: repeating-linear-gradient(135deg, var(--denied) 0 3px, transparent 3px 7px); border-radius: 3px; }
.heat { position: absolute; top: 9px; height: 18px; }
.heat i { position: absolute; top: 0; bottom: 0; display: block; }
.heat i.l1 { background: var(--heat-1); }
.heat i.l2 { background: var(--heat-2); }
.heat i.l3 { background: var(--heat-3); }
.pool .heat, .host .heat { top: 6px; height: 14px; }
.heat i.a { background: var(--act); }
.row.host, .row.act { height: 28px; border-bottom: 1px solid var(--grid); }
.row.host .lab { cursor: pointer; }
.row.host .lab:hover .n { color: var(--accent); }
.row.host .lab .n, .row.act .lab .n { font-size: 12.5px; }
.act .heat { top: 7px; height: 14px; }
.bar.sys .s.inc, .bar.sys .s.full { background: var(--sys); }
.sw.sys { background: var(--sys); }
.sw.act { background: var(--act); opacity: .7; }

.bar { position: absolute; top: 5px; height: 20px; border-radius: 4px; display: flex; overflow: hidden; z-index: 1;
  cursor: grab; touch-action: none; box-shadow: 0 0 0 1px var(--surface); }
.bar.nodrag { cursor: pointer; }
.bar.dragging { cursor: grabbing; opacity: .85; z-index: 4; }
.bar .s { height: 100%; flex: 0 0 auto; }
.bar .s.inc { background: var(--accent); }
.bar .s.full { background: var(--accent-deep); }
.bar .s.synth { background: repeating-linear-gradient(135deg, var(--synth) 0 3px, var(--accent) 3px 6px); }
.bar .s.health { background: repeating-linear-gradient(90deg, var(--ok) 0 2px, transparent 2px 4px); }
.bar .t { position: absolute; left: 6px; top: 0; line-height: 20px; font-size: 11px; color: var(--accent-ink); white-space: nowrap; pointer-events: none; font-weight: 500; }
.bar.est { box-shadow: 0 0 0 1px var(--surface); background-image: none; }
.bar.est .s { opacity: .55; }
.bar.est::after { content: ""; position: absolute; inset: 0; border: 1.5px dashed var(--accent-deep); border-radius: 4px; pointer-events: none; }
.bar.c-warn { box-shadow: 0 0 0 2px var(--warn); }
.bar.c-crit { box-shadow: 0 0 0 2px var(--crit); }
.bar.dim { opacity: .28; }
.bar.hl { box-shadow: 0 0 0 2px var(--ink); z-index: 2; }
.bar.offjob { opacity: .35; filter: grayscale(1); }
.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px;
  font-size: 12px; max-width: 300px; box-shadow: var(--shadow); line-height: 1.4; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:first-child { opacity: .7; }
.tip .w { margin-top: 4px; color: var(--warn-soft); }

/* Side panel */
.side { position: sticky; top: 8px; display: flex; flex-direction: column; max-height: calc(100vh - 24px); }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; }
.tabs button { border: 0; background: none; padding: 10px 10px 9px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { font-size: 11px; background: var(--info-soft); color: var(--muted); padding: 0 6px; border-radius: 999px; font-weight: 600; }
.tabs .count.hot { background: var(--crit-soft); color: var(--crit); }
.pane { padding: 12px; overflow: auto; min-height: 200px; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
.cf { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 0 10px; padding: 9px 8px 9px 0; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.cf + .cf { margin-top: 4px; }
.cf:hover { background: var(--surface-2); border-color: var(--line); }
.cf.on { background: var(--surface-2); border-color: var(--accent); }
.cf .stripe { border-radius: 4px; }
.cf.crit .stripe { background: var(--crit); }
.cf.warn .stripe { background: var(--warn); }
.cf.info .stripe { background: var(--faint); }
.cf h4 { margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.cf p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--info-soft); color: var(--muted); font-family: var(--f-mono); }
.fix { margin-top: 6px; font-size: 12px; color: var(--ink); }
.fix::before { content: "Try "; color: var(--muted); }

.ed h3 { margin: 0; font-family: var(--f-display); font-size: 19px; line-height: 1.2; }
.ed .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.ed .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.ed .stats div { background: var(--surface-2); border-radius: 7px; padding: 6px 8px; }
.ed .stats b { display: block; font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.ed .stats span { font-size: 11px; color: var(--muted); }
.fld { display: grid; gap: 4px; margin-bottom: 11px; }
.fld > span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.fld input[type="time"], .fld input[type="number"], .fld select, .fld .hint input { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; width: 100%; }
.fld .hint { font-size: 12px; color: var(--faint); }
.days { display: flex; gap: 3px; flex-wrap: wrap; }
.days label { position: relative; }
.days input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.days span { display: inline-block; min-width: 34px; text-align: center; padding: 3px 0; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--muted); }
.days input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.days input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.tog { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.ed .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.ch { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.ch b { font-weight: 600; }
.ch .d { color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); }
textarea.out { width: 100%; min-height: 140px; font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--crit); }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }

.drop { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 3px dashed var(--accent);
  display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 24px; color: var(--ink); }
.banner { background: var(--crit-soft); color: var(--crit); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }

@media (max-width: 1100px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .legend { margin-left: 0; }
}
@media (max-width: 560px) {
  .summary { grid-template-columns: minmax(0, 1fr); }
  .tl { max-height: 70vh; }
  .brand h1 { font-size: 22px; }
}
</style>

<header class="top">
  <div class="brand">
    <h1><span class="moon" aria-hidden="true"></span>Nightshift</h1>
    <p>Backup window planner for Veeam Backup &amp; Replication</p>
  </div>
  <div class="server" id="server"></div>
  <div class="spacer"></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <button class="btn" id="btnOpen" type="button">Open export</button>
  <button class="btn ghost" id="btnSample" type="button">Load sample</button>
</header>

<div id="banner" class="banner" hidden></div>

<section class="summary" id="summary" aria-label="Summary"></section>

<section class="controls" aria-label="View settings">
  <div class="dnav">
    <button class="btn ghost" type="button" id="dPrev" aria-label="Previous day">‹</button>
    <label>From <input type="date" id="startDate"></label>
    <button class="btn ghost" type="button" id="dNext" aria-label="Next day">›</button>
    <button class="btn ghost" type="button" id="dToday">Today</button>
  </div>
  <label>Show
    <select id="horizon">
      <option value="night" title="12:00 to 12:00 the next day">1 night</option>
      <option value="1">1 day</option>
      <option value="3">3 days</option>
      <option value="7">7 days</option>
      <option value="14" selected>14 days</option>
      <option value="31">31 days</option>
    </select>
  </label>
  <div class="seg" role="group" aria-label="Duration estimate">
    <button type="button" data-est="median" aria-pressed="true">Typical run</button>
    <button type="button" data-est="p90" aria-pressed="false">Slow night (p90)</button>
  </div>
  <div class="seg" role="group" aria-label="Rows to show">
    <button type="button" data-view="all" aria-pressed="true">Everything</button>

<script>
(() => {
"use strict";

// ---------- constants ----------
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const DAB = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MAB = MONTHS.map(m => m.slice(0, 3));
let LABW = 230;
const SYS_LABEL = { ConfigurationBackup: "Configuration backup", SobrOffload: "SOBR offload", SureBackup: "SureBackup", Tape: "Tape", SecurityAnalyzer: "Security analyzer", MalwareScan: "Malware scan" };
const isSys = j => ["System", "SureBackup", "Tape"].includes(j.type);
const typeLabel = j => j.type === "System" ? (SYS_LABEL[j.systemKind] || "System job") : (TYPE_LABEL[j.type] || j.type);
const TYPE_LABEL = { System: "System jobs", Backup: "Backup", BackupCopy: "Backup copy", Agent: "Agent backup", Replica: "Replication", SureBackup: "SureBackup", Tape: "Tape", FileBackup: "File share", Other: "Other" };
const SCHED_LABEL = { daily: "Daily", monthly: "Monthly", periodic: "Periodic", continuous: "Continuous", after: "After another job", immediate: "Immediate copy", none: "Not scheduled" };

// ---------- state ----------
const S = {
  data: null, orig: null, isSample: false,
  settings: {
    start: null, horizon: 14, offset: 0, est: "median", group: "repo", view: "all", pxh: 16, anon: false, showOff: false,
    prod: { start: 480, end: 1080, days: DAYS.slice(0, 5) },
    throughput: 250, incPct: 15, synthPct: 35, healthPct: 25,
    proxyCores: 1, proxyRam: 2, repoTasksPerCore: 3, repoRamPerCore: 4,
  },
  sim: null, sel: null, selConf: null, tab: "conf", confirmReset: false,
};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
const parseHM = s => { const m = /^(\d{1,2}):(\d{2})/.exec(s || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const dur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${pad(r)}m` : `${r}m`; };

// ---------- time model: minutes since 00:00 of the start date, naive server-local time ----------
let T0 = 0;
const dateOf = dayIdx => new Date(T0 + dayIdx * 864e5);
const dayName = dt => DAYS[(dt.getUTCDay() + 6) % 7];
const fmtAt = min => { const d = dateOf(Math.floor(min / 1440)); return `${DAB[(d.getUTCDay() + 6) % 7]} ${d.getUTCDate()} ${MAB[d.getUTCMonth()]} ${hhmm(min)}`; };
const fmtDay = dayIdx => { const d = dateOf(dayIdx); return `${DAB[(d.getUTCDay() + 6) % 7]} ${d.getUTCDate()} ${MAB[d.getUTCMonth()]}`; };

function monthlyMatch(r, dt) {
  if (!r) return false;
  if (Array.isArray(r.months) && r.months.length && !r.months.includes(MONTHS[dt.getUTCMonth()])) return false;
  if (r.dayOfMonth != null && r.dayOfMonth !== "") {
    if (r.dayOfMonth === "Last") return new Date(dt.getTime() + 864e5).getUTCMonth() !== dt.getUTCMonth();
    return dt.getUTCDate() === +r.dayOfMonth;
  }
  if (r.weekNumber && r.dayOfWeek) {
    if (dayName(dt) !== r.dayOfWeek) return false;
    if (r.weekNumber === "Last") return new Date(dt.getTime() + 7 * 864e5).getUTCMonth() !== dt.getUTCMonth();
    const n = { First: 1, Second: 2, Third: 3, Fourth: 4 }[r.weekNumber];
    return Math.ceil(dt.getUTCDate() / 7) === n;
  }
  return false;
}
const monthlyText = r => !r ? "" : (r.dayOfMonth != null && r.dayOfMonth !== "" ? `day ${r.dayOfMonth} of the month` : `${(r.weekNumber || "").toLowerCase()} ${r.dayOfWeek || ""} of the month`);
function ruleMatch(rule, dt) {
  if (!rule || !rule.enabled) return false;
  if (rule.kind === "monthly") return monthlyMatch(rule.monthly, dt);
  return Array.isArray(rule.days) && rule.days.includes(dayName(dt));
}

// ---------- lookups ----------
const repoById = id => S.data.repositories.find(r => r.id === id);
const jobById = id => S.data.jobs.find(j => j.id === id);
const origJob = id => S.orig.jobs.find(j => j.id === id);
let anonMap = new Map();
function buildAnon() {
  anonMap = new Map();
  S.data.jobs.forEach((j, i) => anonMap.set(j.id, `Job ${pad(i + 1)}`));
  S.data.repositories.forEach((r, i) => anonMap.set(r.id, `Repository ${String.fromCharCode(65 + (i % 26))}${i >= 26 ? Math.floor(i / 26) : ""}`));
  (S.data.proxies || []).forEach((p, i) => anonMap.set(p.id, `Proxy ${i + 1}`));
  (S.data.hosts || []).forEach((h, i) => anonMap.set(h.id, `Server ${pad(i + 1)}`));
}
const nm = obj => !obj ? "Unknown" : (S.settings.anon && !S.data.anonymized && anonMap.has(obj.id) ? anonMap.get(obj.id) : obj.name);

// ---------- durations ----------
function durations(job) {
  const h = job.history || {}, p90 = S.settings.est === "p90";
  const pick = (med, hi) => p90 ? (hi ?? (med != null ? med * 1.3 : null)) : med;
  let fullH = pick(h.fullMedianMin, h.fullP90Min);
  let incH = pick(h.incMedianMin, h.incP90Min);
  const gb = +job.sourceSizeGB || 0;
  const estFull = Math.max(10, gb ? (gb * 1024) / (S.settings.throughput * 60) : 60) * (p90 ? 1.25 : 1);
  const full = fullH ?? estFull;
  const ov = job.override || {};
  const inc = ov.durationMin != null && ov.durationMin !== "" ? +ov.durationMin : (incH ?? Math.max(5, full * S.settings.incPct / 100));
  return { inc, full, incEst: incH == null && (ov.durationMin == null || ov.durationMin === ""), fullEst: fullH == null };
}

function tasksFor(job, cap) {
  const ov = job.override || {};
  if (ov.tasks != null && ov.tasks !== "") return Math.max(1, +ov.tasks);
  return Math.max(1, Math.min(+job.objectCount || 1, cap || 9999));
}

// ---------- simulation ----------
function simulate() {
  const st = S.settings, H = st.horizon, V0 = st.offset || 0, END = V0 + H * 1440, BEGIN = V0 - 1440;
  const d0 = st.start.split("-").map(Number);
  T0 = Date.UTC(d0[0], d0[1] - 1, d0[2]);
  const jobs = S.data.jobs.filter(j => j.enabled !== false && j.scheduleEnabled !== false);
  const runsByJob = new Map();
  let rid = 0;

  function fullsFor(job, dt) {
    const f = job.fulls || {};
    const active = ruleMatch(f.active, dt);
    const synthetic = !active && f.synthetic && f.synthetic.enabled && (f.synthetic.days || []).includes(dayName(dt));
    const health = ruleMatch(job.healthCheck, dt);
    return { kind: active ? "active" : synthetic ? "synthetic" : "inc", health };
  }

  function makeRun(job, start, first, scale = 1, srcId = null) {
    const dt = dateOf(Math.floor(start / 1440));
    const f = first ? fullsFor(job, dt) : { kind: "inc", health: false };
    const d = durations(job);
    const seg = [];
    let est = false;
    if (f.kind === "active") { seg.push({ k: "full", m: d.full * scale }); est = d.fullEst; }
    else if (f.kind === "synthetic") { seg.push({ k: "inc", m: d.inc * scale }, { k: "synth", m: d.full * st.synthPct / 100 * scale }); est = d.incEst || d.fullEst; }
    else { seg.push({ k: "inc", m: d.inc * scale }); est = d.incEst; }
    if (f.health) { seg.push({ k: "health", m: d.full * st.healthPct / 100 }); est = est || d.fullEst; }
    const len = Math.max(3, seg.reduce((a, s) => a + s.m, 0));
    return { id: ++rid, jobId: job.id, start, end: start + len, seg, kind: f.kind, health: f.health, est, flags: new Set(), src: srcId };
  }

  const done = new Set();
  const add = (job, list) => { runsByJob.set(job.id, list.filter(r => r.end > BEGIN && r.start < END)); done.add(job.id); };

  // pass 1: jobs with their own clock
  for (const job of jobs) {
    const sc = job.schedule || { type: "none" };
    const list = [];
    if (sc.type === "daily") {
      const t = parseHM(sc.time);
      if (t != null) for (let i = -1; i <= H; i++) { const dt = dateOf(i); if ((sc.days || DAYS).includes(dayName(dt))) list.push(makeRun(job, i * 1440 + t, true)); }
      add(job, list);
    } else if (sc.type === "monthly") {
      const t = parseHM((sc.monthly || {}).time || sc.time);
      if (t != null) for (let i = -1; i <= H; i++) { if (monthlyMatch(sc.monthly, dateOf(i))) list.push(makeRun(job, i * 1440 + t, true)); }
      add(job, list);
    } else if (sc.type === "periodic") {
      const N = Math.max(5, +((sc.periodic || {}).everyMinutes) || 60), off = +((sc.periodic || {}).offsetMinutes) || 0;
      let lastDay = null;
      for (let t = BEGIN + off; t < END; t += N) {
        if (!allowedAt(job, t)) continue;
        const di = Math.floor(t / 1440);
        list.push(makeRun(job, t, di !== lastDay)); lastDay = di;
      }
      add(job, list);
    } else if (sc.type === "continuous") {
      let t = BEGIN, n = 0, lastDay = null;
      while (t < END && n++ < 3000) {
        if (!allowedAt(job, t)) { t = (Math.floor(t / 60) + 1) * 60; continue; }
        const di = Math.floor(t / 1440);
        const r = makeRun(job, t, di !== lastDay); lastDay = di; list.push(r); t = r.end + 1;
      }
      add(job, list);
    } else if (sc.type !== "after" && sc.type !== "immediate") {
      add(job, []);
    }
  }
  // pass 2: chained and immediate jobs, resolved in dependency order
  for (let pass = 0; pass < 12; pass++) {
    let progress = false;
    for (const job of jobs) {
      if (done.has(job.id)) continue;
      const sc = job.schedule || {};
      const deps = sc.type === "after" ? [sc.afterJobId] : (job.sourceJobIds || []);
      const live = deps.filter(id => jobs.some(j => j.id === id));
      if (!live.every(id => done.has(id))) continue;
      const list = [];
      if (sc.type === "after") {
        for (const pr of (runsByJob.get(sc.afterJobId) || [])) list.push(makeRun(job, pr.end + 1, true, 1, pr.jobId));
      } else {
        const tot = live.reduce((a, id) => a + (+jobById(id).objectCount || 1), 0) || 1;
        for (const id of live) {
          const sh = (+jobById(id).objectCount || 1) / tot;
          for (const pr of (runsByJob.get(id) || [])) list.push(makeRun(job, pr.end + 2, false, sh, id));
        }
        list.sort((a, b) => a.start - b.start);
      }
      add(job, list); progress = true;
    }
    if (!progress) break;
  }
  for (const job of jobs) if (!done.has(job.id)) add(job, []); // circular or missing dependency

  const all = [...runsByJob.values()].flat();
  const conflicts = [];
  const pressure = new Map(); // key -> {cap, segs}

  // --- resource pressure (repository task slots and proxy pools) ---
  const resources = new Map();
  for (const job of jobs) {
    const repo = repoById(job.repositoryId);
    if (repo) {
      const key = "repo:" + repo.id;
      if (!resources.has(key)) resources.set(key, { key, label: nm(repo), cap: +repo.maxTasks || 0, repo, jobs: [] });
      resources.get(key).jobs.push(job);
    }
    if (usesProxy(job)) {
      const pk = proxyKey(job);
      if (pk) {
        if (!resources.has(pk.key)) resources.set(pk.key, { key: pk.key, label: pk.label, cap: pk.cap, pool: true, jobs: [] });
        resources.get(pk.key).jobs.push(job);
      }
    }
  }
  for (const res of resources.values()) {
    const ev = [];
    for (const job of res.jobs) {
      const t = tasksFor(job, res.cap);
      for (const r of runsByJob.get(job.id) || []) { ev.push([r.start, t, r]); ev.push([r.end, -t, r]); }
    }
    ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const segs = []; let cur = 0; const active = new Map();
    for (let i = 0; i < ev.length; i++) {
      const [t, dlt, r] = ev[i];
      if (dlt > 0) active.set(r.id, r); else active.delete(r.id);
      cur += dlt;
      const nt = i + 1 < ev.length ? ev[i + 1][0] : t;
      if (nt > t && cur > 0) segs.push({ a: t, b: nt, d: cur, runs: [...active.values()] });
    }
    pressure.set(res.key, { cap: res.cap, segs });
    if (!res.cap) continue;
    // oversubscription occurrences
    const occ = [];
    for (const s of segs) {
      if (s.d <= res.cap || s.runs.length < 2 || s.b <= V0 || s.a >= END) continue;
      const last = occ[occ.length - 1];
      if (last && s.a <= last.end + 1) { last.end = s.b; last.peak = Math.max(last.peak, s.d); s.runs.forEach(r => last.runs.add(r)); }
      else occ.push({ start: s.a, end: s.b, peak: s.d, runs: new Set(s.runs) });
    }
    if (occ.length) {
      const worst = occ.reduce((a, b) => b.peak > a.peak ? b : a);
      const jobsIn = new Set(); occ.forEach(o => o.runs.forEach(r => { jobsIn.add(r.jobId); r.flags.add("slots"); }));
      const days = new Set(occ.map(o => Math.floor(o.start / 1440)));
      const crit = worst.peak >= res.cap * 1.5;
      conflicts.push({
        id: "slots:" + res.key, type: "slots", sev: crit ? "crit" : "warn", resKey: res.key,
        title: `${res.label} ${res.pool ? "are" : "is"} oversubscribed`,
        detail: `Up to ${worst.peak} parallel tasks against ${res.cap} slots, ${spanText(days.size, H)}. Jobs will queue and finish later than shown.`,
        fix: `stagger the start times of ${[...worst.runs].map(r => nm(jobById(r.jobId))).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3).join(", ")}.`,
        occ: occ.map(o => ({ start: o.start, end: o.end, label: `${fmtAt(o.start)} · ${o.peak}/${res.cap}` })), focus: worst.start, jobIds: [...jobsIn],
      });
    }
  }

  // --- server load: every role a server holds adds to its CPU and RAM need ---
  const hostLoad = new Map(), contrib = new Map();
  const pushC = (hid, a, b, pt, rt) => { if (!hid || !(b > a)) return; if (!contrib.has(hid)) contrib.set(hid, []); contrib.get(hid).push([a, pt, rt], [b, -pt, -rt]); };
  for (const res of resources.values()) {
    const p = pressure.get(res.key); if (!p) continue;
    let targets = [];
    if (res.pool) {
      const px = S.data.proxies || [];
      const set = res.key.startsWith("pool:auto:") ? px.filter(x => (x.type || "VMware") === res.key.slice(10)) : px.filter(x => res.key.slice(5).split(",").includes(x.id));
      const tot = set.reduce((a, x) => a + (+x.maxTasks || 1), 0) || 1;
      targets = set.map(x => ({ hid: x.hostId, share: (+x.maxTasks || 1) / tot, proxy: true }));
    } else {
      const r = res.repo, ext = (r.extents || []).filter(e => e && e.hostId);
      if (ext.length) { const tot = ext.reduce((a, e) => a + (+e.maxTasks || 1), 0); targets = ext.map(e => ({ hid: e.hostId, share: (+e.maxTasks || 1) / tot })); }
      else if ((r.gatewayIds || []).length) targets = r.gatewayIds.map(g => ({ hid: g, share: 1 / r.gatewayIds.length }));
      else if (r.hostId) targets = [{ hid: r.hostId, share: 1 }];
    }
    for (const t of targets) for (const sg of p.segs) {
      const d = Math.min(sg.d, res.cap || sg.d) * t.share; // queued tasks don't load the server
      pushC(t.hid, sg.a, sg.b, t.proxy ? d : 0, t.proxy ? 0 : d);
    }
  }
  for (const h of (S.data.hosts || [])) {
    const ev = (contrib.get(h.id) || []).sort((a, b) => a[0] - b[0]);
    const segs = []; let pt = 0, rt = 0;
    for (let i = 0; i < ev.length; i++) {
      pt += ev[i][1]; rt += ev[i][2];
      const nt = i + 1 < ev.length ? ev[i + 1][0] : ev[i][0];
      if (nt > ev[i][0] && (pt > 1e-6 || rt > 1e-6)) {
        const repoCores = rt / st.repoTasksPerCore;
        segs.push({ a: ev[i][0], b: nt, pt, rt, cores: pt * st.proxyCores + repoCores, ram: pt * st.proxyRam + repoCores * st.repoRamPerCore });
      }
    }
    hostLoad.set(h.id, segs);
    const vis = segs.filter(x => x.b > V0 && x.a < END);
    if (!vis.length) continue;
    const pk = vis.reduce((m, x) => x.cores > m.cores ? x : m, vis[0]);
    const pkR = vis.reduce((m, x) => Math.max(m, x.ram), 0);
    const roles = hostRoles(h).join(", ");
    const over = x => (h.cores && x.cores > h.cores + 1e-6) || (h.ramGB && x.ram > h.ramGB + 1e-6);
    if (!h.cores && !h.ramGB) {
      conflicts.push({ id: "hostinfo:" + h.id, type: "hostinfo", sev: "info", jobIds: [], hostId: h.id,
        title: `${nm(h)} hardware unknown`,
        detail: `At peak this server needs about ${pk.cores.toFixed(1)} cores and ${Math.ceil(pkR)} GB RAM for its Veeam roles (${roles}). Enter its cores and RAM to check it.`,
        fix: "click the server name in the Servers group.", occ: [], focus: pk.a });
      continue;
    }
    const occ = [];
    for (const x of vis) { if (!over(x)) continue; const l = occ[occ.length - 1]; if (l && x.a <= l.end + 1) { l.end = x.b; l.c = Math.max(l.c, x.cores); l.r = Math.max(l.r, x.ram); } else occ.push({ start: Math.max(V0, x.a), end: x.b, c: x.cores, r: x.ram }); }
    if (occ.length) {
      const w = occ.reduce((a, b) => b.c > a.c ? b : a);
      const crit = (h.cores && w.c > h.cores * 1.5) || (h.ramGB && w.r > h.ramGB * 1.5);
      const days = new Set(occ.map(o => Math.floor(o.start / 1440)));
      conflicts.push({ id: "host:" + h.id, type: "host", sev: crit ? "crit" : "warn", jobIds: [], hostId: h.id,
        title: `${nm(h)} is short on CPU or RAM`,
        detail: `Its roles (${roles}) need up to ${w.c.toFixed(1)} cores and ${Math.ceil(w.r)} GB RAM, against ${h.cores || "?"} cores and ${h.ramGB || "?"} GB, ${spanText(days.size, H)}. Tasks will run slower than their history.`,
        fix: "lower the task limit on this server's roles, move a role to another server, or add CPU and RAM.",
        occ: occ.map(o => ({ start: o.start, label: `${fmtAt(o.start)} · ${o.c.toFixed(1)}/${h.cores || "?"} cores` })), focus: w.start });
    }
  }

  // --- observed background activity that lands on busy hours ---
  const busyAt = (t0, t1) => {
    const out = new Set();
    for (const [key, p] of pressure) {
      if (!p.cap || !key.startsWith("repo:")) continue;
      if (p.segs.some(x => x.a < t1 && x.b > t0 && x.d / p.cap >= 0.9)) out.add(nm(repoById(key.slice(5))));
    }
    for (const h of (S.data.hosts || [])) if (h.cores && (hostLoad.get(h.id) || []).some(x => x.a < t1 && x.b > t0 && x.cores / h.cores >= 0.9)) out.add(nm(h));
    return out;
  };
  for (const a of (S.data.activity || [])) {
    if (!Array.isArray(a.profile) || a.profile.length !== 168) continue;
    let hours = 0, peakV = 0; const names = new Set(), occ = [];
    for (let t = Math.floor(V0 / 60) * 60; t < END; t += 60) {
      {
        const wd = DAYS.indexOf(dayName(dateOf(Math.floor(t / 1440)))), h = (((t % 1440) + 1440) % 1440) / 60;
        const v = a.profile[wd * 24 + h];
        if (v < 0.3) continue;
        const b = busyAt(t, t + 60);
        if (b.size) { hours++; peakV = Math.max(peakV, v); b.forEach(n => names.add(n)); if (!occ.length || occ[occ.length - 1].start + 60 < t) occ.push({ start: t, label: fmtAt(t) }); }
      }
    }
    if (hours >= 2) {
      const tw = topWindow(a.profile), list = [...names];
      conflicts.push({ id: "act:" + a.kind + a.label, type: "act", sev: peakV >= 1 ? "warn" : "info", jobIds: [],
        title: `Busy hours overlap with ${a.label.charAt(0).toLowerCase() + a.label.slice(1)}`,
        detail: `From ${a.sessions || "past"} sessions, this usually runs ${tw}. On ${occ.length} occasion${occ.length > 1 ? "s" : ""} in view that's while ${list.slice(0, 3).join(", ")}${list.length > 3 ? " and others" : ""} ${list.length > 1 ? "are" : "is"} at 90% or more of capacity.`,
        fix: a.kind === "RepositoryMaintenance" ? "move compact and health check days away from your full backup night." : "keep that slot free of heavy jobs, or reschedule the activity if VBR lets you.",
        occ, focus: occ[0] ? occ[0].start : 0 });
    }
  }

  // --- per-job checks ---
  const prod = st.prod;
  for (const job of jobs) {
    const runs = runsByJob.get(job.id) || [];
    const vis = runs.filter(r => r.start >= V0 && r.start < END);
    const J = nm(job);
    // backup window exceeded
    if (job.schedule?.window?.enabled) {
      const hits = [];
      for (const r of vis) { const m = firstDenied(job, r.start + 1, r.end); if (m != null) { r.flags.add("window"); hits.push({ r, m }); } }
      if (hits.length) {
        const w = hits.reduce((a, b) => (b.r.end - b.m) > (a.r.end - a.m) ? b : a);
        conflicts.push({ id: "window:" + job.id, type: "window", sev: "crit", jobIds: [job.id],
          title: `${J} runs past its backup window`,
          detail: `On ${hits.length} run${hits.length > 1 ? "s" : ""} the job is still busy when the window closes. The worst is ${fmtAt(w.r.start)}, window closes ${hhmm(w.m)}, predicted end ${hhmm(w.r.end)}. Veeam can terminate the job at the window edge.`,
          fix: w.r.kind !== "inc" ? "move the full backup to a night with more room, or start earlier." : "start earlier or widen the window.",
          occ: hits.map(h => ({ start: h.r.start, label: fmtAt(h.r.start) })), focus: w.r.start });
      }
      const bad = vis.filter(r => !allowedAt(job, r.start));
      if (bad.length) {
        bad.forEach(r => r.flags.add("window"));
        conflicts.push({ id: "wstart:" + job.id, type: "wstart", sev: "warn", jobIds: [job.id],
          title: `${J} is scheduled outside its own window`,
          detail: `${bad.length} scheduled start${bad.length > 1 ? "s fall" : " falls"} in hours the backup window does not allow, so those runs will not start on time.`,
          fix: "align the start time with the window.", occ: bad.map(r => ({ start: r.start, label: fmtAt(r.start) })), focus: bad[0].start });
      }
    }
    // production hours
    if (prod.days.length && prod.end > prod.start) {
      const hits = [];
      for (const r of vis) { const m = prodOverlap(r.start, r.end); if (m != null) { r.flags.add("prod"); hits.push({ r, m }); } }
      if (hits.length) {
        const days = new Set(hits.map(h => Math.floor(h.m / 1440)));
        const w = hits.reduce((a, b) => (b.r.end - b.m) > (a.r.end - a.m) ? b : a);
        const periodic = ["periodic", "continuous"].includes(job.schedule?.type) || isSys(job);
        conflicts.push({ id: "prod:" + job.id, type: "prod", sev: periodic ? "info" : "warn", jobIds: [job.id],
          title: `${J} runs into production hours`,
          detail: isSys(job) ? `This system job runs ${hits.length === 1 ? "once" : hits.length + " times"} during production hours${days.size > 1 ? ` over ${days.size} days` : ""}. That's often fine, but it competes with restores and daytime jobs.` : periodic ? `This job runs every ${job.schedule.periodic?.everyMinutes || "few"} minutes, so ${hits.length} run${hits.length > 1 ? "s" : ""} land in production hours${days.size > 1 ? ` on ${days.size} days` : ""}. Fine if that is intended.`
            : `Still running during production hours on ${days.size} day${days.size > 1 ? "s" : ""}. Worst case ${fmtAt(w.r.start)} ends ${hhmm(w.r.end)}.`,
          fix: periodic ? "add a backup window to keep it out of business hours." : (w.r.kind !== "inc" ? "move the full to a weekend night." : "start earlier."),
          occ: hits.map(h => ({ start: h.r.start, label: fmtAt(h.r.start) })), focus: w.r.start });
      }
    }
    // overlapping itself
    const self = [];
    for (let i = 1; i < runs.length; i++) if (runs[i].start < runs[i - 1].end && runs[i].end > V0 && runs[i].start < END && !runs[i].src) { runs[i].flags.add("self"); self.push(runs[i]); }
    if (self.length) conflicts.push({ id: "self:" + job.id, type: "self", sev: "crit", jobIds: [job.id],
      title: `${J} is still running when its next run is due`,
      detail: `${self.length} run${self.length > 1 ? "s start" : " starts"} before the previous one has finished. Veeam skips or delays the overlapping run.`,
      fix: "lengthen the interval or shorten the job.", occ: self.map(r => ({ start: r.start, label: fmtAt(r.start) })), focus: self[0].start });
    // copy before source
    if (job.type === "BackupCopy" && job.schedule?.type !== "immediate" && (job.sourceJobIds || []).length) {
      const hits = [];
      for (const r of vis) for (const sid of job.sourceJobIds) for (const sr of (runsByJob.get(sid) || [])) {
        if (r.start >= sr.start && r.start < sr.end) { hits.push({ r, sr }); r.flags.add("copy"); }
      }
      if (hits.length) {
        const srcNames = [...new Set(hits.map(h => nm(jobById(h.sr.jobId))))];
        conflicts.push({ id: "copy:" + job.id, type: "copy", sev: "crit", jobIds: [job.id, ...new Set(hits.map(h => h.sr.jobId))],
          title: `${J} starts before its source finishes`,
          detail: `${hits.length} run${hits.length > 1 ? "s start" : " starts"} while ${srcNames.join(", ")} is still writing, so the copy picks up the previous restore point.`,
          fix: `start it after ${hhmm(Math.max(...hits.map(h => h.sr.end)))} or switch it to immediate copy mode.`,
          occ: hits.map(h => ({ start: h.r.start, label: fmtAt(h.r.start) })), focus: hits[0].r.start });
      }
    }
    // no history
    const h = job.history || {};
    if ((h.runs || 0) === 0 && vis.length) conflicts.push({ id: "hist:" + job.id, type: "hist", sev: "info", jobIds: [job.id],
      title: `${J} has no run history yet`,
      detail: `Durations are estimated from ${job.sourceSizeGB ? Math.round(job.sourceSizeGB).toLocaleString() + " GB at " + st.throughput + " MB/s" : "defaults"}. Bars are drawn dashed.`,
      fix: "set a duration in the Job tab if you know it.", occ: [], focus: vis[0].start });
  }

  // --- several fulls on one repository on the same day ---
  for (const repo of S.data.repositories) {
    const byDay = new Map();
    for (const job of jobs.filter(j => j.repositoryId === repo.id)) for (const r of runsByJob.get(job.id) || []) {
      if (r.kind === "inc" || r.start < V0 || r.start >= END) continue;
      const di = Math.floor((r.start - 720) / 1440); // a "night" runs noon to noon
      if (!byDay.has(di)) byDay.set(di, []);
      byDay.get(di).push(r);
    }
    const nights = [...byDay.entries()].filter(([, rs]) => new Set(rs.map(r => r.jobId)).size >= 2);
    if (nights.length) {
      const worst = nights.reduce((a, b) => b[1].length > a[1].length ? b : a);
      nights.forEach(([, rs]) => rs.forEach(r => r.flags.add("fulls")));
      conflicts.push({ id: "fulls:" + repo.id, type: "fulls", sev: worst[1].length >= 3 ? "warn" : "info", jobIds: [...new Set(nights.flatMap(([, rs]) => rs.map(r => r.jobId)))],
        title: `${worst[1].length} full backups land on ${nm(repo)} the same night`,
        detail: `${worst[1].map(r => nm(jobById(r.jobId))).join(", ")} all run a full or synthetic full on the night of ${fmtDay(worst[0])}. That night carries most of the week's I/O.`,
        fix: "spread full backup days across the week.",
        occ: nights.map(([di, rs]) => ({ start: Math.min(...rs.map(r => r.start)), label: `${fmtDay(di)} · ${rs.length} fulls` })), focus: Math.min(...worst[1].map(r => r.start)) });
    }
  }

  const sevRank = { crit: 0, warn: 1, info: 2 };
  conflicts.sort((a, b) => sevRank[a.sev] - sevRank[b.sev] || a.title.localeCompare(b.title));

  // summary stats
  let busiest = null;
  for (const [key, p] of pressure) {
    if (!key.startsWith("repo:") || !p.cap) continue;
    const pk = p.segs.filter(s => s.b > V0 && s.a < END).reduce((m, s) => Math.max(m, s.d), 0);
    const ratio = pk / p.cap;
    if (!busiest || ratio > busiest.ratio) busiest = { key, peak: pk, cap: p.cap, ratio, repo: repoById(key.slice(5)) };
  }
  let latest = null;
  for (const r of all) {
    if (r.start < V0 || r.start >= END) continue;
    const job = jobById(r.jobId); if (["periodic", "continuous"].includes(job.schedule?.type) || isSys(job)) continue;
    const night = Math.floor((r.start - 720) / 1440);
    const endRel = r.end - (night * 1440 + 720); // minutes after noon of night start
    if (!latest || endRel > latest.rel) latest = { rel: endRel, end: r.end, run: r };
  }
  let busiestHost = null;
  for (const h of (S.data.hosts || [])) {
    const segs = (hostLoad.get(h.id) || []).filter(x => x.b > V0 && x.a < END);
    const pk = segs.reduce((m, x) => Math.max(m, x.cores), 0);
    const ratio = h.cores ? pk / h.cores : 0;
    if (pk && (!busiestHost || ratio > busiestHost.ratio || (!busiestHost.ratio && pk > busiestHost.peak))) busiestHost = { h, peak: pk, ratio };
  }
  S.sim = { runsByJob, all, conflicts, pressure, resources, busiest, busiestHost, latest, END, V0, hostLoad };
}

function allowedAt(job, min) {
  const w = job.schedule?.window;
  if (!w || !w.enabled || !w.allowed) return true;
  const dt = dateOf(Math.floor(min / 1440));
  const h = Math.floor((((min % 1440) + 1440) % 1440) / 60);
  const row = w.allowed[dayName(dt)];
  return !row || row[h] !== false;
}
function firstDenied(job, a, b) {
  let m = a;
  while (m < b) { if (!allowedAt(job, m)) return Math.max(a, Math.floor(m / 60) * 60); m = (Math.floor(m / 60) + 1) * 60; }
  return null;
}
function prodOverlap(a, b) {
  const p = S.settings.prod;
  for (let di = Math.floor(a / 1440); di <= Math.floor(b / 1440); di++) {
    if (!p.days.includes(dayName(dateOf(di)))) continue;
    const s = di * 1440 + p.start, e = di * 1440 + p.end;
    const v0 = S.settings.offset || 0, v1 = v0 + S.settings.horizon * 1440;
    if (a < e && b > s && s < v1 && e > v0) return Math.max(a, s, v0);
  }
  return null;
}
function spanText(n, H) { return H <= 1 ? (S.settings.offset ? "during this night" : "on this day") : `on ${n} of ${H} days`; }
function hostRoles(h) {
  const r = [];
  if (h.isBackupServer) r.push("backup server");
  (S.data.proxies || []).filter(p => p.hostId === h.id).forEach(p => r.push(`${p.type === "HyperV" ? "Hyper-V" : p.type} proxy (${p.maxTasks || "no"} tasks)`));
  for (const repo of S.data.repositories) {
    if (repo.hostId === h.id) r.push(`repository ${nm(repo)} (${repo.maxTasks || "no"} tasks)`);
    (repo.extents || []).filter(e => e && e.hostId === h.id).forEach(e => r.push(`extent ${e.name || ""} of ${nm(repo)} (${e.maxTasks || "no"} tasks)`));
    if ((repo.gatewayIds || []).includes(h.id)) r.push(`gateway for ${nm(repo)}`);
    if (repo.mountServerId === h.id) r.push(`mount server for ${nm(repo)}`);
  }
  return [...new Set(r)];
}
function topWindow(pr) {
  let best = 0, bi = 0;
  pr.forEach((v, i) => { if (v > best) { best = v; bi = i; } });
  let a = bi, b = bi;
  while (pr[(a + 167) % 168] >= best * 0.5 && (a + 167) % 168 !== bi) a = (a + 167) % 168;
  while (pr[(b + 1) % 168] >= best * 0.5 && (b + 1) % 168 !== a) b = (b + 1) % 168;
  const lab = i => `${DAB[Math.floor(i / 24)]} ${pad(i % 24)}:00`;
  const daily = DAYS.every((_, d) => pr[d * 24 + (bi % 24)] >= best * 0.5);
  return daily ? `every day from ${pad(a % 24)}:00 to ${pad((b + 1) % 24)}:00` : `from ${lab(a)} to ${lab((b + 1) % 168)}`;
}
function usesProxy(job) { return ["Backup", "Replica"].includes(job.type) && ["VMware", "HyperV"].includes(job.platform || "VMware"); }
function proxyKey(job) {
  const px = S.data.proxies || [];
  if (job.proxyAuto !== false || !(job.proxyIds || []).length) {
    const plat = job.platform || "VMware";
    const set = px.filter(p => (p.type || "VMware") === plat);
    if (!set.length) return null;
    return { key: "pool:auto:" + plat, label: `${plat === "HyperV" ? "Hyper-V" : plat} proxies`, cap: set.reduce((a, p) => a + (+p.maxTasks || 0), 0) };
  }
  const set = px.filter(p => job.proxyIds.includes(p.id));
  if (!set.length) return null;
  const ids = set.map(p => p.id).sort();
  return { key: "pool:" + ids.join(","), label: set.map(p => nm(p)).join(" + "), cap: set.reduce((a, p) => a + (+p.maxTasks || 0), 0) };
}

// ---------- rendering ----------
const tl = $("#tl"), pane = $("#pane"), tip = $("#tip");

function rowsModel() {
  const st = S.settings;
  const jobs = S.data.jobs.filter(j => st.showOff || (j.enabled !== false && j.scheduleEnabled !== false));
  const firstStart = j => { const r = (S.sim.runsByJob.get(j.id) || []).find(r => r.start >= S.sim.V0); return r ? (r.start % 1440 + 1440 - 720) % 1440 : 99999; };
  const sortJobs = list => list.slice().sort((a, b) => firstStart(a) - firstStart(b) || a.name.localeCompare(b.name));
  const rows = [];
  if (st.group === "repo") {
    for (const repo of S.data.repositories) {
      const js = jobs.filter(j => j.repositoryId === repo.id);
      if (!js.length) continue;
      rows.push({ kind: "grp", repo, key: "repo:" + repo.id });
      sortJobs(js).forEach(j => rows.push({ kind: "job", job: j }));
    }
    const orphan = jobs.filter(j => !repoById(j.repositoryId));
    if (orphan.length) { rows.push({ kind: "grp", label: "No repository", key: null }); sortJobs(orphan).forEach(j => rows.push({ kind: "job", job: j })); }
    const pools = [...S.sim.resources.values()].filter(r => r.pool);
    if (pools.length) { rows.push({ kind: "grp", label: "Proxy pools", key: null, meta: "Task slots across proxies" }); pools.forEach(p => rows.push({ kind: "pool", res: p })); }
  } else {
    const types = [...new Set(jobs.map(j => j.type || "Other"))];
    const pools = [...S.sim.resources.values()].filter(r => r.pool);
    S._pools = pools;
    for (const t of types) {
      rows.push({ kind: "grp", label: TYPE_LABEL[t] || t, key: null, meta: `${jobs.filter(j => (j.type || "Other") === t).length} jobs` });
      sortJobs(jobs.filter(j => (j.type || "Other") === t)).forEach(j => rows.push({ kind: "job", job: j }));
    }
    if (pools.length) { rows.push({ kind: "grp", label: "Proxy pools", key: null, meta: "Task slots across proxies" }); pools.forEach(p => rows.push({ kind: "pool", res: p })); }
  }
  const hosts = S.data.hosts || [];
  if (hosts.length) { rows.push({ kind: "grp", label: "Servers", key: null, meta: "CPU need from proxy, repository and gateway tasks" }); hosts.forEach(h => rows.push({ kind: "host", host: h })); }
  const acts = (S.data.activity || []).filter(a => Array.isArray(a.profile) && a.profile.length === 168);
  if (acts.length) { rows.push({ kind: "grp", label: "Background activity", key: null, meta: `Observed over the last ${S.data.historyDays || "?"} days` }); acts.forEach(a => rows.push({ kind: "act", act: a })); }
  if (st.view === "jobs") return rows.filter(r => r.kind === "job" || (r.kind === "grp" && r.repo) || (r.kind === "grp" && !r.repo && !["Servers", "Background activity", "Proxy pools"].includes(r.label)));
  if (st.view === "infra") return rows.filter(r => r.kind !== "job" && !(r.kind === "grp" && !r.repo && !["Servers", "Background activity", "Proxy pools"].includes(r.label)));
  return rows;
}

function schedText(job) {
  const sc = job.schedule || {};
  switch (sc.type) {
    case "daily": return `${sc.time} ${dayList(sc.days)}`;
    case "monthly": return `${(sc.monthly || {}).time || sc.time || ""} ${monthlyText(sc.monthly)}`;
    case "periodic": return `every ${dur(+(sc.periodic || {}).everyMinutes || 60)}`;
    case "continuous": return "continuous";
    case "after": return `after ${nm(jobById(sc.afterJobId))}`;
    case "immediate": return "immediate copy";
    default: return "not scheduled";
  }
}
function dayList(days) {
  if (!days || days.length === 7) return "daily";
  if (days.length === 5 && DAYS.slice(0, 5).every(d => days.includes(d))) return "weekdays";
  return days.map(d => d.slice(0, 3)).join(" ");
}

function render() {
  simulate();
  renderServer(); renderSummary(); bindTiles(); renderTimeline(); renderPane(); renderCounts();
}

function renderServer() {
  const s = S.data.server || {};
  const el = $("#server");
  const srv = S.settings.anon && !S.data.anonymized ? "vbr-server" : (s.name || "VBR");
  el.innerHTML = `<span class="pill mono">${esc(srv)}</span>` +
